[package]
name = "percolate_parser"
version = "0.2.27"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg19"]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19" ]
pg_test = []
pg_bench = ["dep:pgrx-bench"]

[dependencies]
pgrx = "=0.19.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dependencies.pgrx-bench]
version = "=0.19.2"
optional = true

[dev-dependencies]
[dev-dependencies.pgrx-tests]
version = "=0.19.2"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
