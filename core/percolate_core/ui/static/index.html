<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>percolate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  /* theme.css is shared verbatim with the mockups, which have no router. The
     outlet is this app's own object: it has to stretch, or `.page.flush` --
     the chat's full-height three-column layout -- floats at the top of the
     viewport with dead space under it. */
  #outlet { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #outlet > .page { flex: 1; }
</style>
<script>
  try { if (localStorage.getItem("p8-rail") === "shut") document.documentElement.dataset.rail = "shut"; } catch (e) {}
  function toggleRail() {
    var d = document.documentElement, shut = d.dataset.rail === "shut";
    if (shut) delete d.dataset.rail; else d.dataset.rail = "shut";
    try { localStorage.setItem("p8-rail", shut ? "open" : "shut"); } catch (e) {}
  }
  addEventListener("keydown", function (e) {
    if (e.key === "[" && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) toggleRail();
  });
</script>
</head>
<body>
<aside class="rail">
  <div class="rail-head">
    <a class="rail-logo" href="#/" title="Overview">
      <svg viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor">
        <rect x="42" y="2" width="40" height="40" transform="rotate(45 62 22)"/>
        <rect x="2" y="42" width="40" height="40" transform="rotate(45 22 62)"/>
        <rect x="42" y="82" width="40" height="40" transform="rotate(45 62 102)"/></g></svg>
      <span class="wordmark">percolate<span>.</span></span>
    </a>
    <button class="rail-toggle" onclick="toggleRail()" aria-label="Collapse the sidebar" title="Collapse the sidebar  [">
      <span class="when-open"><svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M9.5 3.5L5.5 7.5l4 4"/><path d="M2.5 2v11"/></svg></span>
      <span class="when-shut"><svg viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M5.5 3.5l4 4-4 4"/><path d="M12.5 2v11"/></svg></span>
    </button>
  </div>
  <nav id="nav"></nav>
  <div class="rail-foot">
    <a class="org-switch" id="whoami" href="#/signin" title="Account and sign in">
      <span class="avatar soft">?</span>
      <span class="two-line"><strong>Not signed in</strong><small>NO TOKEN</small></span>
    </a>
  </div>
</aside>
<main class="main">
  <div class="topbar">
    <div class="crumbs" id="crumbs"></div>
    <span class="spacer"></span>
    <div class="pill-row" id="conn"></div>
  </div>
  <div id="session-notice" aria-live="polite"></div>
  <div id="outlet"></div>
</main>

<script type="module">
import { h } from "./ui.js";
import * as W from "./views.js";
import * as A from "./access.js";
import { query } from "./workbench.js";
import { files } from "./files.js";
import { sources } from "./sources.js";
import { token, setToken, claims, config, setEndpoint, loadConfig, sessionState, canRenewSession, renewSession, ensureSession, devToken } from "./api.js";

/* Top-level navigation also registers its screens. Child screens are added
   to ROUTES below without creating another sidebar entry. */
const NAV = [
  ["", [["", "Overview", "home", W.overview], ["chat", "Chat", "chat", A.chat], ["help", "Help", "book", A.help]]],
  ["Work", [["workflows", "Workflows", "flow", W.workflows],
            ["runs", "Runs", "runs", W.runs],
            ["schedules", "Schedules", "clock", W.schedules],
            ["query", "Query", "grid", query], ["sources", "Data Sources", "flow", sources], ["files", "Files", "book", files]]],
  ["Fleet", [["queues", "Queues & pools", "pools", W.queues],
             ["scale", "Load & limits", "scale", W.scale],
             ["events", "Events", "events", W.events]]],
  ["Access", [["agents", "Agents & Plugins", "agents", A.agents],
              ["users", "Users", "users", A.users],
              ["roles", "Roles", "roles", A.roles],
              ["keys", "Keys & sessions", "keys", A.keys],
              ["settings", "Settings", "settings", A.settings],
              ["surface", "Surface", "grid", A.surface]]],
];
const ROUTES = new Map(NAV.flatMap(([, items]) => items.map((i) => [i[0], i])));
ROUTES.set("draft", ["draft", "Draft", "book", W.draft]);
const ALIAS = { run: "runs", draft: "workflows" };

const ICONS = {
  home: '<path d="M2 7l5.5-4.5L13 7v6H2z"/>',
  chat: '<path d="M2 3h11v8H7l-3 3v-3H2z"/>',
  flow: '<path d="M2 3h4v3H2zM9 3h4v3H9zM5.5 10h4v3h-4z"/><path d="M4 6v2h7V6M7.5 8v2"/>',
  book: '<path d="M2.5 2.5h4c1 0 1 .8 1 .8V13s0-.8-1-.8h-4zM12.5 2.5h-4c-1 0-1 .8-1 .8V13s0-.8 1-.8h4z"/>',
  runs: '<path d="M2 8h3l2-5 2 10 2-5h2"/>',
  clock: '<circle cx="7.5" cy="7.5" r="5.5"/><path d="M7.5 4v3.5L10 9"/>',
  pools: '<rect x="1.5" y="2" width="12" height="3.2"/><rect x="1.5" y="6.4" width="12" height="3.2"/><rect x="1.5" y="10.8" width="12" height="2.4"/>',
  scale: '<path d="M2 12.5V6M6 12.5V3M10 12.5V8M14 12.5V4.5"/>',
  events: '<path d="M1.5 11l3-4 2.5 2L10 4.5l3.5 3"/>',
  agents: '<circle cx="7.5" cy="4.5" r="2.5"/><path d="M2.5 13c0-2.8 2.2-4.5 5-4.5s5 1.7 5 4.5"/>',
  users: '<circle cx="5.5" cy="5" r="2.3"/><circle cx="11" cy="5.8" r="1.8"/><path d="M1.5 12.5c0-2.3 1.8-3.8 4-3.8s4 1.5 4 3.8M10.5 9c1.8 0 3 1.2 3 3.2"/>',
  roles: '<path d="M7.5 1.5l5 2.2v4c0 3-2.2 5.2-5 6.3-2.8-1.1-5-3.3-5-6.3v-4z"/>',
  keys: '<circle cx="4.5" cy="7.5" r="2.8"/><path d="M7.3 7.5H14M12 7.5v2.6M10 7.5v2"/>',
  settings: '<circle cx="7.5" cy="7.5" r="2.3"/><path d="M7.5 1.2v1.8M7.5 12v1.8M13.8 7.5H12M3 7.5H1.2M12 3l-1.3 1.3M4.3 10.7L3 12M12 12l-1.3-1.3M4.3 4.3L3 3"/>',
  grid: '<rect x="2" y="2" width="4.6" height="4.6"/><rect x="8.4" y="2" width="4.6" height="4.6"/><rect x="2" y="8.4" width="4.6" height="4.6"/><rect x="8.4" y="8.4" width="4.6" height="4.6"/>',
};
const iconEl = (n) => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 15 15"); s.setAttribute("fill", "none");
  s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "1.2");
  s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
  s.innerHTML = ICONS[n] || ICONS.grid;
  return s;
};

function drawNav(active) {
  document.getElementById("nav").replaceChildren(...NAV.map(([group, items]) =>
    h("div", { class: "nav-group" },
      group ? h("h6", {}, group) : null,
      items.flatMap(([slug, label, ic]) => {
        const item = h("a", { class: "nav-item", href: "#/" + slug, title: label,
                              "aria-current": slug === active ? "page" : null },
          iconEl(ic), h("span", { class: "lbl" }, label));
        /* The chat sessions live HERE, under the Chat item, rather than in a
           column of their own. A list of session titles is navigation, and
           navigation already has a home -- giving it a second one cost the
           conversation 244px of measure for something the rail was already
           shaped to hold. The view fills it; the router empties it. */
        return slug === "chat" && active === "chat"
          ? [item, h("div", { class: "rail-sessions", id: "rail-sessions" })]
          : [item];
      }))));
}

let authRequired = false;
function drawWho() {
  const c = claims(), active = sessionState() === "active";
  const label = active ? "Your workspace" : token() ? "Session expired" : "Sign in";
  document.getElementById("whoami").replaceChildren(
    h("span", {class:"avatar soft"}, active ? (c.sub || "?").slice(0,2).toUpperCase() : "↗"),
    h("span", {class:"two-line"}, h("strong", {}, label),
      h("small", {}, active ? (config().devToken ? "Development" : "Account") : "Continue to Percolate")));
  document.getElementById("conn").replaceChildren(
    h("span", {class:"connection-label", title:config().rest}, config().devToken ? "Development workspace" : "Workspace"),
    h("a", {class:"btn", href:"#/signin"}, active ? "Account" : "Sign in"));
  const notice = document.getElementById("session-notice");
  const expired = authRequired || ["expired","invalid"].includes(sessionState());
  notice.replaceChildren();
  if (!expired || location.hash === "#/signin") return;
  notice.append(h("div", {class:"session-banner", role:"alert"},
    h("div", {}, h("strong", {}, "Your session has expired"),
      h("p", {}, "Continue where you left off. Your drafts are saved.")),
    canRenewSession() && c?.sub ? h("button", {class:"btn primary", onclick:async e => {
      e.target.disabled = true;
      try { await renewSession(); authRequired = false; drawWho(); }
      catch (_) { location.hash = "#/signin"; }
    }}, "Renew session") : h("a", {class:"btn primary", href:"#/signin"}, "Sign in")));
}

function signin() {
  const active = sessionState() === "active" && !authRequired;
  const dev = canRenewSession();
  const sub = h("input", {class:"control mono", "aria-label":"Development user ID",
    value:claims()?.sub || localStorage.getItem("p8-sub") || "11111111-1111-1111-1111-111111111111"});
  const paste = h("textarea", {class:"control mono", rows:4, "aria-label":"Access token", placeholder:"Paste your access token", autocomplete:"off", spellcheck:"false"});
  const out = h("div", {role:"status"});
  const destination = () => {
    const saved = sessionStorage.getItem("p8-auth-return");
    return saved?.startsWith("#/") && saved !== "#/signin" ? saved : "#/files";
  };
  const done = () => { authRequired = false; drawWho(); location.hash = destination(); };
  const use = h("button", {class:"btn primary", onclick:async e => {
    e.target.disabled = true;
    try {
      if (!/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(sub.value.trim())) throw new Error("Enter a valid development user ID.");
      await renewSession(sub.value.trim());
      localStorage.setItem("p8-sub",sub.value.trim());
      done();
    } catch (err) { out.replaceChildren(h("p", {class:"note rose"},err.message)); }
    finally { e.target.disabled = false; }
  }}, active ? "Return to workspace" : "Continue to workspace");
  const tokenEntry = h("div", {class:"form-stack"},
    h("label", {class:"field"}, h("span", {}, "Access token"), paste),
    h("button", {class:"btn", onclick:() => {
      const previous = token();
      setToken(paste.value.trim());
      if (sessionState() !== "active") { setToken(previous); out.replaceChildren(h("p",{class:"note rose"},"This token is expired or invalid. Use a current access token.")); return; }
      done();
    }}, "Sign in with token"));
  return h("div", {class:"page account-page"},
    h("div", {class:"account-card"},
      h("span", {class:"kicker"}, dev ? "Development workspace" : "Your workspace"),
      h("h1", {}, active ? "You're signed in" : "Welcome to Percolate"),
      h("p", {class:"account-intro"}, active ? "Your files, conversations and workflows are ready." :
        dev ? "Continue with your development identity. Your session renews automatically while you work." : "Use an access token from your administrator or Percolate CLI to sign in."),
      dev ? use : tokenEntry,
      dev ? h("details", {class:"disclosure"}, h("summary", {}, "Development identity"),
        h("div", {class:"form-stack"}, h("label", {class:"field"}, h("span", {}, "User ID"), sub),
          h("p", {class:"hint"}, "The development server provides this sign-in method. Your existing user permissions still apply."))) : null,
      dev ? h("details", {class:"disclosure"}, h("summary", {}, "Use an access token instead"), tokenEntry) : null,
      active ? h("button", {class:"btn ghost", onclick:() => {
        setToken(""); sessionStorage.setItem("p8-signed-out","1"); authRequired = false; route();
      }}, "Sign out") : null,
      out));
}

let routeVersion = 0;
async function route() {
  const version = ++routeVersion;
  const [slug, arg] = (location.hash || "#/").slice(2).split("/");
  const outlet = document.getElementById("outlet");
  if (slug !== "signin") sessionStorage.setItem("p8-auth-return",location.hash || "#/");
  drawWho();
  drawNav(ALIAS[slug] || (ROUTES.has(slug) ? slug : null));
  const label = slug === "signin" ? "Sign in"
    : slug === "run" ? "Run detail"
    : (ROUTES.get(slug) || [, "Overview"])[1];
  document.getElementById("crumbs").replaceChildren(h("span", { class: "here" }, label));
  outlet.replaceChildren(h("div", { class: "page" }, h("div", { class: "empty" }, "Loading...")));
  try {
    const screen = slug === "signin" ? signin() : slug === "run" ? await W.run(arg)
      : await (ROUTES.get(slug) || ROUTES.get(""))[3](arg);
    if (version !== routeVersion) return;
    outlet.replaceChildren(screen);
  } catch (e) {
    if (version !== routeVersion) return;
    outlet.replaceChildren(h("div", { class: "page" },
      h("div", { class: "note rose" }, String((e && e.message) || e))));
  }
  document.querySelector(".main").scrollTo?.(0, 0);
}

addEventListener("hashchange", route);
addEventListener("p8-session-changed", () => { authRequired = false; drawWho(); });
addEventListener("p8-auth-required", () => { authRequired = true; drawWho(); });
addEventListener("focus", () => { ensureSession().then(drawWho).catch(drawWho); });
setInterval(drawWho, 15000);
drawWho();

/* `?dev=1` mints the dev token with the compose-file defaults and goes straight
   in -- the same code path the Sign in button takes, so no token ever travels
   in a URL. */
(async () => {
  await loadConfig();          // before anything reads config(), including drawWho
  drawWho();
  if (config().devToken && new URLSearchParams(location.search).get("dev") === "1" && !token() && !sessionStorage.getItem("p8-signed-out")) {
    const secret = config().devSecret;
    if (secret) {
      setToken(await devToken(
        localStorage.getItem("p8-sub") || "11111111-1111-1111-1111-111111111111", secret));
      drawWho();
    }
  }
  try { await ensureSession(); } catch (_) {}
  /* The status vocabulary, once, after there is a token to read it with. It
     only adds colour, so a deployment that refuses the read renders exactly as
     before rather than not at all. */
  try {
    const { read } = await import("./api.js");
    const { READS } = await import("./reads.js");
    const { setStatusVocabulary } = await import("./ui.js");
    setStatusVocabulary((await read(READS.lifecycleStates)).rows);
  } catch (_) {}
  if (!token()) location.hash = "#/signin";
  route();
})();
</script>
</body>
</html>
