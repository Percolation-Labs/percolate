# WHAT KEEPS A PIN FROM BECOMING A FREEZE.
#
# Dependabot SECURITY updates are on for this repository and need no file: they
# open a PR when an advisory lands against something in a manifest or a lock,
# and they are the half that matters. This file adds the other half, for one
# ecosystem only.
#
# uv, since REM-1151: the image and CI install uv.lock exactly, so the lock is
# now the only thing that moves a Python dependency. Before it, every build
# re-resolved pyproject's ranges and nothing could go stale; after it, nothing
# moves unless this does. One grouped PR a month, and CI grades it on the
# versions it proposes, because CI installs the lock it edits.
#
# github-actions, because an action reference is the dependency nobody
# re-resolves. Two of them in this collection were BRANCH refs -- `@stable` and
# `@release/v1`, one of them on the job that publishes to PyPI with an OIDC
# credential -- so the build was fetching whatever those branches pointed at
# that morning. They are pinned by commit now, and a pin with nothing bumping
# it goes stale in a way that is worse than a tag: it stops getting fixes and
# nobody notices, because it never fails.
#
# MONTHLY AND GROUPED, deliberately. A repository with no review step does not
# need a daily stream of single-line PRs; it needs one PR a month that CI has
# already graded. Everything else here is covered by security updates, which
# fire on an advisory rather than on a release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 3
