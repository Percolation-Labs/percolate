# The gate this repository did not have.
#
# Until now the only workflows here were `release` and `claude`: nothing ran on
# a push, so every change was verified by whoever made it, in whatever way they
# chose, and the record of that verification was a sentence in a commit message.
# That held while the package was small and stopped holding the day its CLI
# started calling functions in another repository's schema.
#
# Deliberately two cheap things rather than a suite. `tests/smoke.py` says in its
# own header that a large test suite written before the thing has been used is
# backwards, and that the checks worth keeping are the ones protecting a STATED
# guarantee. This runs those, plus the version guard, and nothing else.
name: ci

# NO `paths-ignore: ['**.md']`, which this trigger carried until 2026-09-13.
# Markdown is an input here, not decoration: `dev/check-releases.sh` below reads
# RELEASES.md and fails when a published tag is missing from it. So a PR that
# changed only RELEASES.md was the one PR that could break that check, and it was
# also the one PR that did not run it. This job has no database or image, and
# runs in about a minute and a half, so a docs PR can afford the whole of it.
# Carving out a markdown-only job would mean a second list of which steps read
# markdown, and that list would drift.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, because check-version.sh asks whether this version is already
          # published and check-releases.sh audits the ones that are. A shallow
          # clone has none -- both would pass by knowing nothing.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}

      # [all], not the base install: one of the checks asserts that every model
      # provider the package claims to ship can actually be constructed, and it
      # can only fail meaningfully when they are present. With the base install
      # it reports "provider not installed", which is true of the environment
      # rather than of the package.
      - name: Install with every extra it claims to ship
        run: pip install --quiet ".[all]"

      # This job names every file it runs, so the step names say what each one
      # protects -- and a file nobody named was never run. Eleven were not,
      # among them the tests REM-62 and REM-69 were closed on. First, because
      # it is the cheapest step here and its answer does not depend on the rest.
      - name: Every test file is run, or says why it is not
        run: dev/check-tests-run.sh

      - name: The stated guarantees still hold
        run: python tests/smoke.py

      - name: Browser transport remains opt-in and authenticated
        run: python -m unittest discover -s tests -p test_agent_cors.py

      # The live half of this needs a database and lives in dev/ui_reads.py.
      # What runs here is the structure that made the live check possible: the
      # screens share their read contracts with the audit, so a projection
      # cannot go unexecuted the way five of them did.
      - name: Screens and their audit still read the same contracts
        run: python -m unittest discover -s tests -p test_ui_reads.py

      # The Schedules screen reimplements the engine's cron matcher so it can
      # preview a schedule. These pin the decisions that differ from an
      # ordinary cron library; dev/cron_agrees.py runs both against a live
      # database, which needs one and so does not run here.
      - name: The browser's cron reader still means what the engine means
        run: python -m unittest discover -s tests -p test_cron.py

      - name: Expired browser sessions recover safely
        run: python -m unittest discover -s tests -p test_ui_session.py

      - name: Browser file uploads preserve authentication
        run: python -m unittest discover -s tests -p test_content_cors.py

      # The half of the lake's boundary that needs no database or bucket: what
      # authored SQL may say, and what a sealed DuckDB connection may touch.
      # The end-to-end run is p8-subsystems/dev/tests/content/e2e-lake.py.
      - name: Lake SQL is one SELECT, inside a seal it cannot undo
        run: python -m unittest discover -s tests -p test_lake_guard.py

      - name: Tool identity and persisted execution
        run: python -m unittest discover -s tests -p test_tool_auth.py

      # README.md documents the scheduled step as `{{task.id}}` and `task` was
      # not a resolvable namespace, so the documented step could not dispatch
      # and the seeded reference sent no body -- and /internal/run needs the id
      # because the runtime completes its own triggering task (REM-126). Also
      # pins that a malformed call is refused by name rather than 500'd.
      - name: The documented scheduled step resolves, and a bad one is refused
        run: python -m unittest discover -s tests -p test_scheduled_step_resolves.py

      # workflow.heartbeat_task shipped, was granted to `worker`, and was called
      # by nothing -- so a task running longer than the queue's stale_timeout was
      # reaped and re-run with the first copy still in flight (REM-109). These
      # are the pure-logic half: that the loop beats at all while a handler runs,
      # that it paces itself from the queue rather than from a constant here, and
      # that it stops before the terminal transition. The live proof needs a
      # database and is p8-subsystems/dev/tests/workflow/19-*.sql.
      - name: A long task is heartbeated, so it finishes once
        run: python -m unittest discover -s tests -p test_worker_heartbeat.py

      # A token's claims reach the database whole and before the role switch
      # (REM-44, REM-48), and a credential reaches only the origin it is bound
      # to (REM-49). The worker and API-ingest files are here because the
      # binding changed what they assert; none of them was run by CI before.
      - name: Caller claims stay whole, credentials stay on their origin
        run: |
          for t in test_caller_identity.py test_credential_origins.py \
                   test_worker_agent_auth.py test_worker_row_templates.py test_api_ingest.py; do
            python -m unittest discover -s tests -p "$t" || exit 1
          done

      # A NUL in text this runtime did not compose does not abort the write
      # (REM-146). Postgres text cannot hold U+0000 and both foreign-string
      # writes hand Postgres a jsonb argument the SQL side reads back with
      # `->>`, so one byte took a tool-calling turn to `failed` after
      # twenty-three seconds of model work and took a 777-byte upload's whole
      # ingest run down with it. The file also asserts that BOTH seams call the
      # helper, because the rule is "at the boundary" and there are two of them.
      - name: A hostile byte does not abort a write
        run: python -m unittest discover -s tests -p test_nul_at_the_boundary.py

      # The caller's ambient context goes only where their token may (REM-148).
      # `X-P8-User-Id` and `X-P8-Session-Id` were forwarded to every tool
      # destination, so a registered third party echoed back a live user id
      # while `outbound_headers` was correctly withholding the token from the
      # same request. Half of an identity boundary is not one. Six of the
      # thirteen cases are controls -- a bound first-party origin must still
      # receive the context and the caller's token, or delegation breaks.
      - name: The caller's context stops where their token stops
        run: python -m unittest discover -s tests -p test_context_stops_where_the_token_stops.py

      # A summary is derived text and carries no more authority than the window
      # it replaced (REM-94). It was replayed as a SystemPromptPart, so anything
      # an attacker put in a retrieved chunk was restated by our own summarizer
      # and replayed with system authority on every later turn. Two of the four
      # cases here are controls -- the summary's text must still reach the
      # model, and a configured `role='system'` message must KEEP its authority
      # -- so the property cannot be satisfied by dropping summaries or by
      # demoting everything.
      - name: Derived text carries no authority it did not arrive with
        run: python -m unittest discover -s tests -p test_summary_authority.py
      # REM-91 items 4, 5 and 8, from the 2026-09-12 security audit. Three
      # unrelated mechanisms with one shape -- a value from outside used
      # somewhere that decides authority rather than content. A missing
      # P8_JWT_SECRET was an identity; a model-chosen path parameter left its
      # bound operation, past an origin check that urljoin had already
      # normalised the traversal out of; an uploaded file was served inline on
      # the file API's own origin.
      #
      # Named here because this job ENUMERATES files rather than discovering
      # them, so a test nobody adds to this list is a test nobody runs. That was
      # true of five files in this directory when the audit looked, which is why
      # the line above this one exists too.
      - name: Untrusted input cannot widen what a caller may do
        run: python -m unittest discover -s tests -p test_untrusted_input_cannot_widen.py

      # REM-91 item 6, the third leg of the same audit. A step's url is resolved
      # from {{run.*}} and {{steps.*}}, so on the ingestion path it can carry
      # text out of an uploaded document -- and the worker that fetches it sits
      # beside Postgres, MinIO and PostgREST with P8_S3_KEY in its environment.
      # credential_for binds where a NAMED secret may go and TEMPLATE_ENV stops
      # {{env.X}} putting one in a body; neither says anything about an
      # unauthenticated GET to a service that answers because the caller is on
      # its network.
      - name: The worker cannot be pointed back at its own network
        run: python -m unittest discover -s tests -p test_worker_egress.py

      # The same guard at the other two places a caller's URL is fetched. The
      # worker's check lived in worker/http.py and was called from one line, so
      # POST /probe -- any signed-in caller, redirects followed, the response
      # returned -- and an API source's url reached the metadata endpoint and
      # the compose network. test_api_probe.py rides along because nothing ran
      # it, and it now exercises the operator override for its loopback server.
      - name: No caller can point a fetch back at this network
        run: |
          for t in test_egress_everywhere.py test_api_probe.py; do
            python -m unittest discover -s tests -p "$t" || exit 1
          done

      # REM-110. A turn holds one connection for its whole life and takes a
      # second for every query inside it, so a pool of N serves N/2 turns --
      # P8_POOL_MAX at 8 read like eight turns and was four, and the eighth
      # deadlocked with no error and no load involved. The control is the part
      # worth keeping: the same eight turns against the old size must FAIL, in
      # bounded time, with the arithmetic in the message.
      - name: Eight people can hold a conversation at once
        run: python -m unittest discover -s tests -p test_pool_concurrency.py

      # content.api_source in the extension is the one home of an API source's
      # defaults and choices (REM-61); APIConfig and the UI's API_DEFAULTS are
      # copies, and a copy that drifts saves a different source.
      - name: API source settings mean what the database says
        run: python -m unittest discover -s tests -p test_api_source_contract.py

      # These three exist because the dependency moves under us. `result.usage`
      # changed from a METHOD to an ATTRIBUTE between two pydantic-ai versions
      # this package has shipped against, and a serialised budget is a
      # hand-written mapping onto somebody else's field names. Without these, a
      # rename lands as a delegation tree that quietly stops being budgeted --
      # which is indistinguishable from a limit nobody happened to hit.
      - name: A delegation tree still spends one budget
        run: python -m unittest discover -s tests -p test_delegation_budget.py

      - name: Usage is captured and limits still bind
        run: python -m unittest discover -s tests -p test_engine_usage.py

      - name: Telemetry stays off unless configured, and cannot fail a turn
        run: python -m unittest discover -s tests -p test_telemetry.py

      # REM-67. What a statement the database refused comes back as, on both
      # HTTP surfaces: 403 naming the permission it wants, rather than a 500
      # for a turn and a 502 blaming the tool server for a sync.
      - name: A refused caller is told so, and an upstream failure is still 502
        run: python -m unittest discover -s tests -p test_database_refusals.py

      # An exhausted or refused provider account stops after one attempt on
      # every path that calls a provider, and a rate limit is still retried
      # (REM-53).
      - name: A provider failure means one thing on every path
        run: python -m unittest discover -s tests -p test_provider_failures.py

      # A runtime that cannot serve the database it is pointed at refuses at
      # STARTUP rather than inside the first turn. It used to fail in band --
      # AG-UI answers 200 with one RUN_ERROR in a well-formed stream, and
      # `docker compose ps` calls that healthy -- so the deployment looked fine
      # to everything that watches it (REM-136, live pair REM-135). The file
      # includes the refusal made to fail on purpose; a probe only ever run
      # against a working database cannot be told from a `pass`.
      # A publisher's connection that cannot be reset is terminated rather than
      # pooled. When it is ALREADY released, terminate() raises and used to
      # replace the exception the handler exists to re-raise -- so the reason a
      # turn failed was gone and only the cleanup's own failure was logged.
      # Found by the tour (p8-subsystems scenarios/tour).
      - name: A failed connection reset keeps its cause
        run: python -m unittest discover -s tests -p test_reset_failure_keeps_its_cause.py

      - name: A runtime refuses a database it cannot serve
        run: python -m unittest discover -s tests -p test_startup_refuses_a_database_it_cannot_serve.py

      # P8_DSN and P8_DATABASE_URL name one database, and a process holding
      # both used to open two (REM-69). The S3 settings are shared too, while
      # the Content Server and the lake keep their different answers to absence.
      - name: One database and one object store, whoever is asking
        run: python -m unittest discover -s tests -p test_one_config.py

      # An agent with a structured_output_schema answers through an output
      # tool, and the stream mapper carried only text parts, so `stream: true`
      # finished with no answer in it.
      - name: A structured answer reaches a streaming client
        run: python -m unittest discover -s tests -p test_structured_stream.py

      - name: Prose has one wrapping default and one measure
        run: python -m unittest discover -s tests -p test_ui_theme.py

      # These drive the browser modules under node, and every one of them
      # passes when node is missing: four files skip, two error on every case.
      # A skip reads as green, so the step asks for node by name before it
      # runs anything. The runner image ships node; if that changes, this step
      # goes red instead of passing on skips.
      - name: The browser's assistants keep one suggestion contract (REM-62)
        run: |
          node --version
          for t in test_suggestion_contract.py test_query_assist.py test_api_source_assist.py \
                   test_data_sources.py test_workflow_composition.py test_ui_controls.py; do
            python -m unittest discover -s tests -p "$t" || exit 1
          done

      # not run here: test_pool_render.py -- it compares the render against k8s/examples in p8-subsystems, a private repository this job cannot check out; it passes locally against p8-subsystems origin/main 6491ffc with P8_K8S_EXAMPLES set, and no workflow in either repository runs it
      # not run here: test_api_probe.py -- PR #42 adds its step together with the egress guard it now exercises; when #42 merges, this check goes red until this line is deleted

      - name: A released version number may not be reused
        run: dev/check-version.sh

      # The other half of the same question. check-version.sh asks whether THIS
      # number is spent; this asks whether the record of the spent ones is true.
      # v0.1.8 points at a tree that says 0.1.7 and nobody noticed for six days,
      # because a tag is read only when somebody tries to reproduce a release.
      - name: Every published tag is accounted for
        run: dev/check-releases.sh

      # The CLI is what the documentation tells people to run, and it is the
      # part that broke when `auth bootstrap` moved into the extension. Checking
      # the subcommands exist is not a deep test; it is the one that would have
      # caught three doc pages naming a command no published artifact had.
      - name: Every documented subcommand exists
        run: |
          for cmd in worker agent content ingest auth sample; do
            percolate "$cmd" --help >/dev/null \
              || { echo "::error::`percolate $cmd` is documented but missing"; exit 1; }
          done
          echo "worker, agent, content, ingest, auth, sample all present"
