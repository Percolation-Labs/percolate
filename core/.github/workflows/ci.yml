# The gate this repository did not have.
#
# Until now the only workflows here were `release` and `claude`: nothing ran on
# a push, so every change was verified by whoever made it, in whatever way they
# chose, and the record of that verification was a sentence in a commit message.
# That held while the package was small and stopped holding the day its CLI
# started calling functions in another repository's schema.
#
# Deliberately two cheap things rather than a suite. `tests/smoke.py` says in its
# own header that a large test suite written before the thing has been used is
# backwards, and that the checks worth keeping are the ones protecting a STATED
# guarantee. This runs those, plus the version guard, and nothing else.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, because check-version.sh asks whether this version is already
          # published and check-releases.sh audits the ones that are. A shallow
          # clone has none -- both would pass by knowing nothing.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}

      # [all], not the base install: one of the checks asserts that every model
      # provider the package claims to ship can actually be constructed, and it
      # can only fail meaningfully when they are present. With the base install
      # it reports "provider not installed", which is true of the environment
      # rather than of the package.
      - name: Install with every extra it claims to ship
        run: pip install --quiet ".[all]"

      - name: The stated guarantees still hold
        run: python tests/smoke.py

      - name: Browser transport remains opt-in and authenticated
        run: python -m unittest discover -s tests -p test_agent_cors.py

      # The live half of this needs a database and lives in dev/ui_reads.py.
      # What runs here is the structure that made the live check possible: the
      # screens share their read contracts with the audit, so a projection
      # cannot go unexecuted the way five of them did.
      - name: Screens and their audit still read the same contracts
        run: python -m unittest discover -s tests -p test_ui_reads.py

      # The Schedules screen reimplements the engine's cron matcher so it can
      # preview a schedule. These pin the decisions that differ from an
      # ordinary cron library; dev/cron_agrees.py runs both against a live
      # database, which needs one and so does not run here.
      - name: The browser's cron reader still means what the engine means
        run: python -m unittest discover -s tests -p test_cron.py

      - name: Expired browser sessions recover safely
        run: python -m unittest discover -s tests -p test_ui_session.py

      - name: Browser file uploads preserve authentication
        run: python -m unittest discover -s tests -p test_content_cors.py

      # The half of the lake's boundary that needs no database or bucket: what
      # authored SQL may say, and what a sealed DuckDB connection may touch.
      # The end-to-end run is p8-subsystems/dev/tests/content/e2e-lake.py.
      - name: Lake SQL is one SELECT, inside a seal it cannot undo
        run: python -m unittest discover -s tests -p test_lake_guard.py

      - name: Tool identity and persisted execution
        run: python -m unittest discover -s tests -p test_tool_auth.py

      # A token's claims reach the database whole and before the role switch
      # (REM-44, REM-48), and a credential reaches only the origin it is bound
      # to (REM-49). The worker and API-ingest files are here because the
      # binding changed what they assert; none of them was run by CI before.
      - name: Caller claims stay whole, credentials stay on their origin
        run: |
          for t in test_caller_identity.py test_credential_origins.py \
                   test_worker_agent_auth.py test_worker_row_templates.py test_api_ingest.py; do
            python -m unittest discover -s tests -p "$t" || exit 1
          done

      # A summary is derived text and carries no more authority than the window
      # it replaced (REM-94). It was replayed as a SystemPromptPart, so anything
      # an attacker put in a retrieved chunk was restated by our own summarizer
      # and replayed with system authority on every later turn. Two of the four
      # cases here are controls -- the summary's text must still reach the
      # model, and a configured `role='system'` message must KEEP its authority
      # -- so the property cannot be satisfied by dropping summaries or by
      # demoting everything.
      - name: Derived text carries no authority it did not arrive with
        run: python -m unittest discover -s tests -p test_summary_authority.py

      # content.api_source in the extension is the one home of an API source's
      # defaults and choices (REM-61); APIConfig and the UI's API_DEFAULTS are
      # copies, and a copy that drifts saves a different source.
      - name: API source settings mean what the database says
        run: python -m unittest discover -s tests -p test_api_source_contract.py

      # These three exist because the dependency moves under us. `result.usage`
      # changed from a METHOD to an ATTRIBUTE between two pydantic-ai versions
      # this package has shipped against, and a serialised budget is a
      # hand-written mapping onto somebody else's field names. Without these, a
      # rename lands as a delegation tree that quietly stops being budgeted --
      # which is indistinguishable from a limit nobody happened to hit.
      - name: A delegation tree still spends one budget
        run: python -m unittest discover -s tests -p test_delegation_budget.py

      - name: Usage is captured and limits still bind
        run: python -m unittest discover -s tests -p test_engine_usage.py

      - name: Telemetry stays off unless configured, and cannot fail a turn
        run: python -m unittest discover -s tests -p test_telemetry.py

      # REM-67. What a statement the database refused comes back as, on both
      # HTTP surfaces: 403 naming the permission it wants, rather than a 500
      # for a turn and a 502 blaming the tool server for a sync.
      - name: A refused caller is told so, and an upstream failure is still 502
        run: python -m unittest discover -s tests -p test_database_refusals.py

      # An exhausted or refused provider account stops after one attempt on
      # every path that calls a provider, and a rate limit is still retried
      # (REM-53).
      - name: A provider failure means one thing on every path
        run: python -m unittest discover -s tests -p test_provider_failures.py

      - name: A released version number may not be reused
        run: dev/check-version.sh

      # The other half of the same question. check-version.sh asks whether THIS
      # number is spent; this asks whether the record of the spent ones is true.
      # v0.1.8 points at a tree that says 0.1.7 and nobody noticed for six days,
      # because a tag is read only when somebody tries to reproduce a release.
      - name: Every published tag is accounted for
        run: dev/check-releases.sh

      # The CLI is what the documentation tells people to run, and it is the
      # part that broke when `auth bootstrap` moved into the extension. Checking
      # the subcommands exist is not a deep test; it is the one that would have
      # caught three doc pages naming a command no published artifact had.
      - name: Every documented subcommand exists
        run: |
          for cmd in worker agent content ingest auth sample; do
            percolate "$cmd" --help >/dev/null \
              || { echo "::error::`percolate $cmd` is documented but missing"; exit 1; }
          done
          echo "worker, agent, content, ingest, auth, sample all present"
