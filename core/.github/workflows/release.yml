# Cut a release: bump the version, publish the package, publish the image.
#
# This is the button that replaces doing it by hand. It exists because the
# release is not one artifact -- PyPI, Docker Hub and the Helm chart all carry
# the same version number, and a release where one lags is a release that lies.
#
# Manual on purpose. There is no push trigger and no tag trigger, because this
# workflow CREATES the tag: bumping pyproject.toml, committing and tagging are
# the first thing it does, so a tag trigger would either fire on its own commit
# or require someone to have bumped the version by hand first -- which is the
# manual step being removed. `workflow_dispatch` is the release action; the tag
# is its output, not its input.
#
# ---------------------------------------------------------------------------
# What has to be configured once, before the first run:
#
#   PyPI trusted publisher (no API token to leak or rotate) -- on
#   pypi.org/manage/project/percolate-core/settings/publishing add a pending
#   publisher for owner `percolating-sirsh`, repo `percolate-core`, workflow
#   `release.yml`, environment `pypi`.
#
#   gh secret set DOCKERHUB_USERNAME
#   gh secret set DOCKERHUB_TOKEN
#
#   gh secret set P8_RELEASE_TOKEN   # PAT, issues:write on get-percolate
#                                   # and on p8-subsystems. ONE token for all
#                                   # three repos -- @claude uses the same one
#                                   # to reach across them (see claude.yml).
#
# The last one is a PAT and not the built-in GITHUB_TOKEN for a reason that is
# easy to lose an afternoon to: an issue created with GITHUB_TOKEN does not
# trigger workflows. GitHub suppresses that to stop workflows looping, and the
# whole point of the issue below is to trigger get-percolate's claude.yml.
# ---------------------------------------------------------------------------
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: which part of the version to bump
        type: choice
        options: [minor, patch, major]
        default: minor
      publish:
        description: publish for real (off = build and verify, change nothing)
        type: boolean
        default: true

# A second release must not overtake the one mid-publish. Not
# cancel-in-progress: cancelling between the PyPI upload and the image push
# leaves exactly the half-released state this workflow exists to prevent.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # 1. The version. Bumped, committed and tagged before anything is built, so
  #    the artifacts are built from the commit that names them.
  # -------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commit the bump and push the tag
    outputs:
      version: ${{ steps.bump.outputs.version || steps.pre.outputs.version }}
      previous: ${{ steps.bump.outputs.previous }}
      tag: v${{ steps.bump.outputs.version || steps.pre.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # tags, so the duplicate check below can see them

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      # An unreleased version in the tree is a release that did not finish, not
      # a reason to burn another number. 0.1.7 sat here untagged while three
      # documentation pages named it; bumping past it would have published 0.1.8
      # and left every one of those pages pointing at a version that never
      # existed. Same preflight p8-subsystems' release.yml uses, reading the
      # same fact -- a version with a tag is spent.
      - name: Retry an unfinished version, or bump
        id: pre
        run: |
          CUR=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          if git rev-parse -q --verify "refs/tags/v$CUR" >/dev/null; then
            echo "mode=bump" >> "$GITHUB_OUTPUT"
            echo "v$CUR is published; this run will bump ${{ inputs.bump }}"
          else
            echo "mode=retry" >> "$GITHUB_OUTPUT"
            echo "version=$CUR" >> "$GITHUB_OUTPUT"
            echo "::notice::$CUR is in the tree and untagged -- publishing THAT rather than bumping"
          fi

      - name: Bump the version
        id: bump
        if: steps.pre.outputs.mode == 'bump' 
        # Two files, not one. pyproject.toml is what PyPI publishes and
        # percolate_core/__init__.py is what `percolate --version` and both
        # FastAPI titles report -- they drifted once already (0.1.3 shipped
        # reporting 0.1.2), which is precisely the kind of thing a human doing
        # this by hand forgets and a workflow cannot.
        run: python .github/scripts/bump_version.py "${{ inputs.bump }}"

      - name: Refuse to re-release a version that already exists
        # Cheap, and the alternative is finding out from PyPI's rejection after
        # the image has already been pushed -- half a release, unwound by hand.
        run: |
          v="${{ steps.bump.outputs.version || steps.pre.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error::tag v$v already exists" >&2; exit 1
          fi
          if curl -fsS "https://pypi.org/pypi/percolate-core/$v/json" >/dev/null 2>&1; then
            echo "::error::percolate-core $v is already on PyPI" >&2; exit 1
          fi

      # THE BUMP LANDS UNTAGGED. The tag is created by `tag` below, after PyPI
      # and the image exist -- it used to happen here, so a failed publish left
      # v<version> on origin naming a wheel nobody could install, and the
      # duplicate check above then blocked the retry. Skipped entirely in retry
      # mode, where the bump did not run and there is nothing to commit.
      - name: Commit the bump
        if: inputs.publish && steps.bump.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "${{ steps.bump.outputs.version || steps.pre.outputs.version }}: bump"
          git push origin HEAD:"${{ github.ref_name }}"

      - name: Summary
        run: |
          echo "### percolate-core ${{ steps.bump.outputs.version || steps.pre.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          [ "${{ inputs.publish }}" = "true" ] || \
            echo "_dry run: nothing committed, nothing published_" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # 2. The distribution. Built once, here, and published from the artifact --
  #    the sdist and wheel that go to PyPI are the same bytes that were built
  #    and checked, not a second build that happens to use the same inputs.
  # -------------------------------------------------------------------------
  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish && needs.version.outputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build twine
      - run: python -m build
      - name: Check the metadata renders
        # PyPI rejects a bad long_description AFTER upload begins. twine check
        # is the same validation, run before anything is irreversible.
        run: twine check dist/*
      - name: Confirm the built version is the bumped one
        # Only meaningful for a real release: a dry run never committed the
        # bump, so this tree is still on the previous version by design.
        if: inputs.publish
        run: ls dist/ | grep -q "percolate_core-${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  # -------------------------------------------------------------------------
  # 3. PyPI. Its own job with its own environment, because that is what a
  #    trusted publisher binds to -- and because id-token: write is a credential
  #    that should be scoped to the one job that needs it.
  # -------------------------------------------------------------------------
  pypi:
    needs: [version, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/percolate-core/${{ needs.version.outputs.version }}
    permissions:
      id-token: write        # OIDC -- there is no PyPI token in this repo
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  # -------------------------------------------------------------------------
  # 4. The image, both architectures.
  #
  # One runner with buildx rather than the native per-arch matrix that
  # parser.yml uses. That matrix earns its complexity there: percolate_parser
  # is Rust compiled against a PG ABI, and cross-building it under emulation
  # takes the better part of an hour. This image installs published wheels --
  # amd64 and arm64 wheels both exist for everything in [all] -- so emulation
  # costs minutes, not an hour, and the simpler build is the right trade.
  # -------------------------------------------------------------------------
  image:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish && needs.version.outputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: |
            percolationlabs/percolate-core:${{ needs.version.outputs.version }}
            percolationlabs/percolate-core:latest
      - name: Confirm both architectures are in the manifest
        # The failure this catches shows up first for someone else, on the Helm
        # path, long after everything looked fine here: a single-arch image
        # pushed under a tag a cluster pulls. Checking the manifest is two
        # seconds; finding out from an ImagePullBackOff is not.
        if: inputs.publish
        run: |
          docker buildx imagetools inspect \
            "percolationlabs/percolate-core:${{ needs.version.outputs.version }}" \
            | tee /dev/stderr | grep -q linux/amd64
          docker buildx imagetools inspect \
            "percolationlabs/percolate-core:${{ needs.version.outputs.version }}" \
            | grep -q linux/arm64

  # -------------------------------------------------------------------------
  # 5. The GitHub release, once the things it describes actually exist.
  # -------------------------------------------------------------------------
  github_release:
    # AFTER `tag`, because softprops/action-gh-release CREATES the tag when it is
    # missing -- so leaving it earlier would have had the release job quietly
    # doing the one thing the ordering exists to defer. With the tag already
    # there it annotates rather than creates.
    needs: [version, pypi, image, tag]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true

  # -------------------------------------------------------------------------
  # 6. The chart, last.
  #
  # Order matters and this is the reason it is a separate job with `needs`:
  # publish the package and the images FIRST, then the docs and the chart that
  # reference them. The reverse gives you a window where the documented install
  # pulls a tag that does not exist yet, and that window is exactly when
  # somebody tries it.
  #
  # An issue rather than a cross-repo commit. The chart bump is small but it is
  # not mechanical -- Chart.yaml carries two versions that move for different
  # reasons, and the docs quote version numbers in prose. get-percolate's
  # claude.yml picks this up, opens a PR, and merging it fires docs.yml, which
  # republishes the chart. A human sees the diff before the install path moves.
  # -------------------------------------------------------------------------
  chart:
    needs: [version, pypi, image]
    # Removing `if: inputs.publish` was not enough, and the dry run proved it:
    # this job `needs` pypi, pypi is gated on publish, and a job whose
    # dependency is SKIPPED is skipped in turn. So the rehearsal still skipped
    # the riskiest thing here -- checking out another repository and pushing to
    # it -- while reporting success.
    #
    # `always()` re-enables it, and the rest of the condition keeps a real
    # release honest: on a dry run it goes ahead regardless, and on a real one
    # it requires the publishes it is about to describe to have actually
    # happened. Without that second half, `always()` would bump the chart to a
    # version PyPI had just rejected.
    if: >-
      always() && needs.version.result == 'success'
      && (inputs.publish != true
          || (needs.pypi.result == 'success' && needs.image.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Require the token, rather than skipping quietly
        # A missing secret must not look like a successful release. The chart
        # lagging the package is the failure mode this whole workflow exists to
        # prevent, and it is invisible from here.
        env: {TOKEN: "${{ secrets.P8_RELEASE_TOKEN }}"}
        run: |
          [ -n "$TOKEN" ] || {
            echo "::error::P8_RELEASE_TOKEN is not set -- percolate-core ${{ needs.version.outputs.version }} is published but the chart still points at ${{ needs.version.outputs.previous }}. Bump charts/percolate/Chart.yaml on get-percolate by hand." >&2
            exit 1; }

      # -------------------------------------------------------------------
      # The chart and the docs, moved rather than requested.
      #
      # This was an issue asking @claude to open a PR, because the bump "is not
      # mechanical -- Chart.yaml carries two versions that move for different
      # reasons, and the docs quote version numbers in prose". Both halves of
      # that are now false. get-percolate holds every published number in
      # `versions.toml`, its pages carry @@placeholders@@ instead of literals,
      # and `ci/versions.py --set published.core=` moves the one number and
      # rewrites everything that repeats it -- including the chart's own
      # version, which must move because Helm refuses to republish one that
      # already exists.
      #
      # A commit rather than a PR now that the diff is one line in one file,
      # derived rather than judged. `docs.yml` refuses to build a site whose
      # numbers disagree with `versions.toml`, and `coldstart.sh` installs the
      # result, so the review a human was providing is done by two checks that
      # do not get tired.
      # -------------------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CHART_REPO || 'percolating-sirsh/get-percolate' }}
          token: ${{ secrets.P8_RELEASE_TOKEN }}
          path: get-percolate
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}   # tomllib is stdlib from 3.11

      - name: Point the chart and the docs at ${{ needs.version.outputs.version }}
        working-directory: get-percolate
        run: |
          python3 ci/versions.py --set published.core=${{ needs.version.outputs.version }}
          python3 ci/versions.py --check
          git diff --quiet && { echo "already at ${{ needs.version.outputs.version }}"; exit 0; }
          git --no-pager diff --stat
          if [ "${{ inputs.publish }}" != "true" ]; then
            echo "::notice::dry run -- the diff above is what a real release would commit to get-percolate"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "percolate-core ${{ needs.version.outputs.version }}: chart and docs"
          # Rebase before pushing -- the extension release writes the same file
          # for a different key. See parser.yml's docs-version job.
          for _ in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
          done
          echo "::error::could not push the version bump after three rebases" >&2
          exit 1

      # p8-subsystems still gets an issue, and deliberately: what is stale over
      # there is `dev/docker-compose.yml`, the harness its own test suite runs
      # against, and PACKAGING.md's prose. Which version the DEV stack pins is a
      # choice somebody makes, not a number derived from a release -- it pins
      # what the tests were last run against on purpose.
      - name: Ask p8-subsystems to catch up
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.P8_RELEASE_TOKEN }}
          V: ${{ needs.version.outputs.version }}
          PREV: ${{ needs.version.outputs.previous }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > specs-issue.md <<EOF
          @claude percolate-core **$V** is published. get-percolate moved itself
          (chart, compose and docs, by \`ci/versions.py\`). This repository
          quotes the version in two places that are a judgement call rather than
          a derivation, so they are asked for rather than pushed:

          - \`dev/docker-compose.yml\` -- the harness \`dev/tests/run.sh\` runs
            against. It pins \`$PREV\`. Moving it means the suite is exercising
            $V, which is usually right and is still a decision.
          - \`PACKAGING.md\` -- the summary table and the "Current version" line.

          Released by [\`release.yml\`]($RUN).
          EOF
          gh issue create --repo "${{ vars.SPECS_REPO || 'percolating-sirsh/p8-subsystems' }}" \
            --title "percolate-core $V: the dev pin and PACKAGING" \
            --body-file specs-issue.md

  # -------------------------------------------------------------------------
  # THE COMMIT POINT, and it is last on purpose.
  #
  # Everything above can fail and leave a bumped, untagged tree that the next
  # run finishes. Past here the version is on PyPI and Docker Hub and the tag
  # says so -- which is the fact `dev/check-version.sh` and the preflight above
  # both read to decide whether a number is spent.
  # -------------------------------------------------------------------------
  tag:
    needs: [version, pypi, image]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Tag it, now that it exists
        run: |
          V=${{ needs.version.outputs.version }}
          # Set here, not only in the bump step -- that step is skipped on the
          # retry path, and `git tag -a` without an identity dies on
          # `fatal: empty ident name` with everything already published.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "percolate-core $V"
          git push origin "v$V"
          echo "::notice::v$V tagged -- the wheel and image it names are already published"
