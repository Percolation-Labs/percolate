why = "A sql step runs in mode worker or inline (REM-1316, YAML.md). Two functions the worker calls, as it calls get_task_context: worker_sql_step_timeout (the limit it arms) and execute_worker_sql_step (the step's statement, under that limit, raising rather than failing). sql_step_output is execute_sql_step's dispatch moved out so both executors share one copy. with_sql_mode resolves a step's mode when start_workflow creates its task. inline_mode_line lets the engine's own installers say mode inline only to a compiler that knows the key, because two of them run during an upgrade on the last published parser. Nothing held these: the inline executor catches what the worker path must raise."
[added]
functions = ["workflow.execute_worker_sql_step", "workflow.inline_mode_line", "workflow.sql_step_output", "workflow.with_sql_mode", "workflow.worker_sql_step_timeout"]
