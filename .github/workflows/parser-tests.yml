# The parser's own tests, run by something other than nobody.
#
# There were 41 of them -- 20 pure ones in `plan_graph.rs` and 21 `#[pg_test]`s
# in `lib.rs` -- and NOTHING IN EITHER REPOSITORY EXECUTED THEM. (43 now: two
# more `#[pg_test]`s tie the mode list to the error message that offers it and
# to the grammar that publishes it, after the two had drifted apart.) `check.yml`
# says so in as many words ("a change to the Rust is NOT tested here") and is
# honest about why: it runs the published `.so` and a pgrx build is minutes.
# get-percolate's `parser.yml` compiles the crate but only ever runs `cargo
# pgrx package`. So the tests were written, committed, and never once run in
# CI.
#
# What that cost, found by running them for the first time: one was red, and
# had been since `PATH` was added to the modes that take an argument list.
# `a_list_is_still_refused_where_it_means_nothing` asserted the error message
# said "only LOOKUP and RELEVANCE take a list" when the parser had been saying
# "only LOOKUP, RELEVANCE and PATH" for as long as PATH had existed. Harmless
# to the product and exactly the kind of rot an unrun test collects -- which is
# the argument for this file rather than against those tests.
#
# WHY IT IS A SEPARATE WORKFLOW. `check.yml`'s whole affordability argument is
# that it does almost nothing: 26 seconds, no compiler. This job compiles a
# pgrx crate and initdbs a PostgreSQL, which is minutes. Putting it in
# `check.yml` would make every Markdown-adjacent push pay for a Rust build.
# Scoped to the paths that can change the answer instead, so it runs when the
# parser moves and never otherwise.
#
# THE IMAGE IS THIS REPOSITORY'S OWN BUILDER, not a hand-assembled toolchain.
# `dev/Dockerfile.pgrx-builder` already installs postgresql-server-dev-19 and
# the pinned cargo-pgrx, and get-percolate's `parser.yml` already builds the
# release artefacts with it -- so the ABI these tests run against is the ABI
# the shipped `.so` is compiled against, by construction rather than by two
# lists agreeing.
#
# TWO THINGS THE INVOCATION NEEDS, both found by getting them wrong:
#
#   * `--features pg_test`. Without it the `#[pg_test]` macro expands to a
#     plain `#[test]` that grabs the framework mutex and finds no server, and
#     every one of them fails with "Could not obtain test mutex" -- which reads
#     like a harness bug rather than a missing flag.
#   * A NON-ROOT user with a writable sharedir. `initdb` refuses to run as
#     root, and `cargo pgrx test` installs the extension into
#     `pg_config --sharedir` before it can load it, which root owns. Running as
#     `postgres` fixes the first and breaks the second, so the directory is
#     opened up for the run. It is a throwaway container.
name: parser-tests

on:
  push:
    branches: [main]
    paths:
      - 'extension/percolate_parser/**'
      - 'dev/Dockerfile.pgrx-builder'
      - '.github/workflows/parser-tests.yml'
  pull_request:
    paths:
      - 'extension/percolate_parser/**'
      - 'dev/Dockerfile.pgrx-builder'
      - '.github/workflows/parser-tests.yml'
  workflow_dispatch:

concurrency:
  group: parser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keyed on what actually invalidates it: the builder's Dockerfile and the
      # lockfile. Same reasoning parser.yml's cache header gives, and
      # deliberately NOT keyed on Cargo.toml -- the release bumps its version
      # every time, so a key derived from it would change every release by
      # construction and the cache would never hit.
      - name: Cache the crate build
        uses: actions/cache@v6
        with:
          path: extension/percolate_parser/target-test
          key: parser-tests-${{ hashFiles('dev/Dockerfile.pgrx-builder', 'extension/percolate_parser/Cargo.lock') }}
          restore-keys: parser-tests-

      # THE 343 SECONDS THIS JOB SPENT BEFORE IT RAN A SINGLE TEST -- 72% of
      # it -- measured on run 34028283280:
      #
      #     FROM postgres:19beta3-bookworm       9.3s
      #     apt-get install ...                 28.9s
      #     rustup                              19.1s
      #     cargo install --locked cargo-pgrx  257.3s   <- three quarters of it
      #     export to the daemon                25.6s
      #
      # cargo-pgrx is COMPILED FROM SOURCE or it is not obtained at all. pgrx
      # ships no binaries -- the v0.19.2 release carries no assets, so there is
      # nothing for cargo-binstall to fetch -- and the pin is not negotiable,
      # because the ABI it targets is the ABI the shipped .so is built against.
      # So the only move left is to compile it ONCE and keep what came out.
      #
      # NOT buildx layer caching, and that is somebody else's measurement rather
      # than a guess: get-percolate's parser.yml tried exactly that on exactly
      # this Dockerfile and wrote down 280s cold -> 256s warm on the default
      # driver against 358s -> 350s on the container driver, because `--load`
      # from a container driver exports the whole image back into the daemon and
      # costs more than the layers save. What is cached here is the BUILT IMAGE
      # as a tarball, which has no build graph to walk and no export to pay:
      # `docker load` below IS the 25.6s the build was already spending.
      #
      # AND THE BASE IT STARTS FROM, because the Dockerfile is not a pure
      # function of its own text (REM-11). Three of its four layers move
      # underneath it:
      #
      #     FROM postgres:19beta3-bookworm            <- mutable tag
      #     apt-get install ...                       <- unpinned
      #     rustup --default-toolchain stable         <- "stable" moves
      #     cargo install cargo-pgrx --version $PGRX_VERSION  <- the only pinned
      #                                                           one, and it is
      #                                                           now passed in
      #                                                           from Cargo.toml
      #
      # Cache on the Dockerfile alone and a moved base tag is a cache HIT: the
      # toolchain keeps being restored from a tarball built against headers
      # nobody ships any more. get-percolate's parser.yml names that failure in
      # its own header -- "a .so built against one beta's headers and loaded
      # into another's server is not a thing to ship, and it is not a thing a
      # test would catch" -- and cache eviction does not bound the window,
      # because a cache that keeps getting used never expires.
      #
      # RESOLVED RATHER THAN PINNED, which is the whole design. Writing a digest
      # into the Dockerfile would freeze this builder while dev/Dockerfile.pg19
      # -- the RUNTIME image, carrying the same `FROM postgres:19beta3-bookworm`
      # and rebuilt from scratch every release -- kept tracking upstream, and
      # the two drifting apart is the thing being prevented. Resolving the tag
      # at build time keeps them in step and turns a moved base into a miss.
      #
      # The tag is read out of the Dockerfile rather than written here twice, so
      # bumping the base is still a one-line edit in one file.
      - name: Resolve the base image the toolchain is built on
        id: base
        run: |
          TAG=$(sed -n 's/^FROM \([^ ]*\).*/\1/p' dev/Dockerfile.pgrx-builder | head -1)
          [ -n "$TAG" ] || { echo "::error::no FROM line in dev/Dockerfile.pgrx-builder"; exit 1; }
          # The INDEX digest, which moves when any platform's image moves.
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::could not resolve a digest for $TAG (got '$DIGEST')"; exit 1 ;;
          esac
          echo "::notice::toolchain base $TAG is $DIGEST"
          echo "digest=${DIGEST#sha256:}" >> "$GITHUB_OUTPUT"

      # KEYED ON THE DOCKERFILE AND THE RESOLVED BASE, and deliberately with NO
      # restore-keys. The crate cache above wants a near miss; this one must
      # never have one. An image restored under a changed Dockerfile -- or under
      # a base that has moved -- is the wrong toolchain, and it would surface as
      # a red test rather than as a cache miss.
      - name: Cache the pgrx toolchain image
        id: toolchain
        uses: actions/cache@v6
        with:
          path: /tmp/pgrx-builder.tar
          # Cargo.toml IS IN THE KEY because the pgrx pin lives there now and
          # is passed into the build: keyed on the Dockerfile alone, bumping
          # pgrx in the crate would restore an image carrying the previous
          # cargo-pgrx, which is the same "cache hit on the wrong toolchain"
          # this file's header is already about.
          key: pgrx-builder-image-${{ hashFiles('dev/Dockerfile.pgrx-builder', 'extension/percolate_parser/Cargo.toml') }}-${{ steps.base.outputs.digest }}

      # THE TWO NUMBERS, READ FROM THE CRATE THAT DECLARES THEM. `Cargo.toml`
      # says which pgrx this builds against and which pg feature is default;
      # this file restated the second twice in `cargo pgrx init --pg19` and
      # `cargo pgrx test pg19`, and carried the first in a comment. A test run
      # against a different major than the crate builds by default is green and
      # meaningless.
      - name: The pg major and the pgrx pin, read from Cargo.toml
        id: pins
        run: |
          C=extension/percolate_parser/Cargo.toml
          M=$(sed -n 's/^default *= *\["pg\([0-9][0-9]*\)"\].*/\1/p' "$C")
          X=$(sed -n 's/^pgrx *= *"=\{0,1\}\([0-9][0-9.]*\)".*/\1/p' "$C")
          [ -n "$M" ] && [ -n "$X" ] || {
            echo "::error::could not read the pg major and the pgrx pin from $C" >&2
            exit 1; }
          echo "pg=$M"   >> "$GITHUB_OUTPUT"
          echo "pgrx=$X" >> "$GITHUB_OUTPUT"
          echo "pg$M, pgrx $X"

      - name: Build the pgrx toolchain image
        if: steps.toolchain.outputs.cache-hit != 'true'
        working-directory: dev
        run: |
          docker build -f Dockerfile.pgrx-builder \
            --build-arg PGRX_VERSION=${{ steps.pins.outputs.pgrx }} \
            -t pgrx-builder .
          # Saved UNCOMPRESSED on purpose: actions/cache zstds it on the way up,
          # and compressing twice spends a minute to save nothing.
          docker save pgrx-builder -o /tmp/pgrx-builder.tar

      - name: Load the pgrx toolchain image
        if: steps.toolchain.outputs.cache-hit == 'true'
        run: docker load -i /tmp/pgrx-builder.tar

      - name: cargo pgrx test
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/extension/percolate_parser":/work \
            -e PG=${{ steps.pins.outputs.pg }} \
            -w /work pgrx-builder bash -c '
              set -euo pipefail
              chown -R postgres:postgres /work /opt/cargo
              chmod -R a+w "$(pg_config --sharedir)/extension" "$(pg_config --pkglibdir)"
              su postgres -s /bin/bash -c "
                export PATH=/opt/cargo/bin:\$PATH
                export PGRX_HOME=/work/.pgrx CARGO_TARGET_DIR=/work/target-test
                cd /work
                cargo pgrx init --pg$PG /usr/bin/pg_config
                cargo pgrx test pg$PG --features pg_test --no-default-features"'
          # The container writes as root and postgres; the cache action reads it
          # back as the runner.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/extension/percolate_parser"
