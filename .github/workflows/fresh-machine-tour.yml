# The article's fresh-machine tour (dev/examples/muddling-through/TOUR.md), on a runner with nothing installed.
# Runs the tour's commands in order and keeps each step's output as an artifact. Started by hand for a release:
#
#     gh workflow run fresh-machine-tour.yml -R Percolation-Labs/percolate --ref <branch> \
#         -f tag=v0.2.XX -f core=0.2.XX -f bundle_sha256=<sha>
#
# GitHub-hosted on purpose: a new VM each run, so no image, cache or checkout from an earlier one can help.
name: fresh-machine tour
on:
  workflow_dispatch:
    inputs:
      tag: {description: "the release to tour (get-percolate and percolate tag)", required: true}
      core: {description: "percolate-core version on PyPI", required: true}
      bundle: {description: "the bundle asset's file name on the release", required: true}
      bundle_sha256: {description: "the bundle asset's sha256", required: true}
  push:
    branches: ["tour/**"]
jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # the full bundle's load is about an hour (cory, 29 Oct)
    env:
      TAG: ${{ inputs.tag }}
      CORE: ${{ inputs.core }}
      BUNDLE: ${{ inputs.bundle }}
      BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
      P8_DSN: postgres://p8:p8@localhost:5432/percolate
    steps:
      - name: nothing is installed
        run: |
          mkdir -p out
          { docker images; pip cache list 2>&1 | tail -2; ls ~; df -h /; } | tee out/00-clean.txt
      - name: room for the bundle (a reader's machine has it; this runner keeps toolchains the tour does not use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tee -a out/00-clean.txt
          test "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -ge 12 || { echo "under 12 GB free for a ~2 GB load plus images"; exit 1; }
      - name: 1. install the release
        run: |
          mkdir tour && cd tour
          curl -fsSL "https://raw.githubusercontent.com/Percolation-Labs/get-percolate/$TAG/compose/docker-compose.yml" -o docker-compose.yml
          docker compose up -d --wait 2>&1 | tee ../out/01-install.txt
          python3 -m venv .venv && . .venv/bin/activate && pip install "percolate-core[sample,ui]==$CORE" | tail -3 | tee -a ../out/01-install.txt
      - name: 2. sign in
        run: |
          cd tour && . .venv/bin/activate
          psql "$P8_DSN" -c "select rbac.bootstrap_admin('me@example.com', 'a long passphrase')" | tee ../out/02-sign-in.txt
          percolate auth token --email me@example.com > ../out/token
      - name: 3. fetch the example's data
        run: |
          cd tour && . .venv/bin/activate
          ASSET="$BUNDLE"
          curl -fsSLO "https://github.com/Percolation-Labs/percolate/releases/download/$TAG/$ASSET"
          echo "$BUNDLE_SHA256  $ASSET" | sha256sum -c - | tee ../out/03-fetch.txt
          tar xzf "$ASSET"
          { percolate sample load beam-walks
            percolate walk index --source beam-1m22; percolate walk index --source beam-1m35
            percolate sample load beam-walks/walks; } 2>&1 | tee -a ../out/03-fetch.txt
      - name: 3b. the default embedding model is bge-small, registered once (cory's test could not cover a fresh install)
        run: |
          psql "$P8_DSN" -c "select name, dim, provider, is_default from aiq.embedding_models order by name" | tee out/03b-models.txt
          test "$(psql "$P8_DSN" -Atc "select name from aiq.embedding_models where is_default")" = bge-small-en-v1.5
          test "$(psql "$P8_DSN" -Atc "select count(*) from aiq.embedding_models where is_default")" = 1
      - name: 3c. every walk runs to the end (its question step embeds through the stack's own service)
        run: |
          for i in $(seq 1 360); do
            n=$(psql "$P8_DSN" -Atc "select count(*) from aiq.walk_runs where status in ('running', 'pending', 'ready')")
            [ "$n" = 0 ] && break; sleep 10
          done
          psql "$P8_DSN" -c "select status, count(*) from aiq.walk_runs group by 1 order by 1" | tee out/03c-walks.txt
          test "$(psql "$P8_DSN" -Atc "select count(*) from aiq.walk_runs where status <> 'succeeded'")" = 0
          test "$(psql "$P8_DSN" -Atc "select count(*) from aiq.walk_runs")" -gt 0
      - name: 3d. every replayed walk is the walk it replays (no lead left without a recorded verdict)
        run: |
          psql "$P8_DSN" -c "select r.run, count(*) filter (where c.decision = 'unjudged') as unjudged
                               from aiq.walk_runs r cross join lateral aiq.walk_clues(r.run) c
                              where r.replays is not null group by 1 order by 2 desc" | tee out/03d-replays.txt
          test "$(psql "$P8_DSN" -Atc "select count(*) from aiq.walk_runs r cross join lateral aiq.walk_clues(r.run) c
                                        where r.replays is not null and c.decision = 'unjudged'")" = 0
      - name: 3e. every replayed walk says it is faithful (walk_structure's decider.faithful; absent is a failure, not a pass)
        run: |
          psql "$P8_DSN" -c "select r.run, aiq.walk_structure(r.run)->'decider'->'faithful' as faithful
                               from aiq.walk_runs r where r.replays is not null order by r.created_at" | tee out/03e-faithful.txt
          test "$(psql "$P8_DSN" -Atc "select count(*) from aiq.walk_runs r where r.replays is not null
                                        and (aiq.walk_structure(r.run)->'decider'->'faithful') is distinct from 'true'::jsonb")" = 0
      - name: 4. the Walks screen answers
        run: |
          cd tour && . .venv/bin/activate
          export P8_UI_REST_URL=http://localhost:3000 P8_UI_CORE_URL=http://localhost:8080 P8_UI_CONTENT_URL=http://localhost:8081
          nohup percolate ui serve --host 127.0.0.1 --port 8082 > ../out/04-ui.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8082/ > ../out/04-ui.html && break; sleep 2; done
          grep -qi walks ../out/04-ui.html
      - name: 5. query it from psql
        run: |
          psql "$P8_DSN" -c "select run, question_text, status from aiq.walk_runs order by created_at" | tee out/05-psql.txt
      - name: 5b. the query MCP server answers the reader's token (Claude itself is the Mac leg)
        run: |
          T=$(cat out/token)
          H=(-H "Authorization: Bearer $T" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream')
          curl -fsS http://127.0.0.1:8090 "${H[@]}" -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"tour","version":"0"}}}' | tee out/05b-mcp-init.txt
          curl -fsS http://127.0.0.1:8090 "${H[@]}" -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | tee out/05b-mcp-tools.txt | head -c 2000
          grep -q '"tools"' out/05b-mcp-tools.txt
      - name: keep what each step printed
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: tour-${{ github.run_id }}, path: out/}
