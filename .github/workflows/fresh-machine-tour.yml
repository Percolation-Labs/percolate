# The article's fresh-machine tour (dev/examples/muddling-through/TOUR.md), on a runner with nothing installed.
# Runs the tour's commands in order and keeps each step's output as an artifact. Started by hand for a release:
#
#     gh workflow run fresh-machine-tour.yml -R Percolation-Labs/percolate \
#         -f tag=v0.2.XX -f core=0.2.XX -f bundle=walks-starter.tar.gz -f bundle_sha256=<sha> \
#         -f samples=walks-starter/smoke -f walks=walks-starter/smoke/walks        # the 5-minute smoke first
#
# then the full tour, with samples and walks naming the bundle's own directories.
#
# GitHub-hosted on purpose: a new VM each run, so no image, cache or checkout from an earlier one can help.
name: fresh-machine tour
on:
  workflow_dispatch:
    inputs:
      tag: {description: "the release to tour (get-percolate and percolate tag)", required: true}
      core: {description: "percolate-core version on PyPI", required: true}
      bundle: {description: "the bundle asset's file name on the release", required: true}
      bundle_sha256: {description: "the bundle asset's sha256", required: true}
      bundle_url: {description: "where the bundle is published, if not the percolate release of this tag", required: false, default: ""}
      samples: {description: "sample directories to load before indexing, space-separated", required: true}
      walks: {description: "walk directories to load after indexing, space-separated", required: true}
jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # the full bundle's load is about an hour (cory, 29 Oct)
    env:
      TAG: ${{ inputs.tag }}
      CORE: ${{ inputs.core }}
      BUNDLE: ${{ inputs.bundle }}
      BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
      BUNDLE_URL: ${{ inputs.bundle_url }}
      SAMPLES: ${{ inputs.samples }}
      WALKS: ${{ inputs.walks }}
      P8_DSN: postgres://p8:p8@localhost:5432/percolate
    steps:
      - name: nothing is installed
        run: |
          mkdir -p out
          { docker images; pip cache list 2>&1 | tail -2; ls ~; df -h /; } | tee out/00-clean.txt
      - name: room for the bundle (a reader's machine has it; this runner keeps toolchains the tour does not use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tee -a out/00-clean.txt
          test "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -ge 12 || { echo "under 12 GB free for a ~2 GB load plus images"; exit 1; }
      - name: 1. install the release
        run: |
          mkdir tour && cd tour
          curl -fsSL "https://raw.githubusercontent.com/Percolation-Labs/get-percolate/$TAG/compose/docker-compose.yml" -o docker-compose.yml
          docker compose up -d --wait 2>&1 | tee ../out/01-install.txt
          python3 -m venv .venv && . .venv/bin/activate && pip install "percolate-core[sample,ui]==$CORE" | tail -3 | tee -a ../out/01-install.txt
      - name: 2. sign in
        run: |
          cd tour && . .venv/bin/activate
          # the quickstart's route: the token is signed inside the stack, which holds the secret it verifies with
          uid=$(psql "$P8_DSN" -Atc "select rbac.bootstrap_admin('me@example.com', 'a long passphrase')")
          echo "first user $uid" | tee ../out/02-sign-in.txt
          docker compose exec -T content percolate auth token --sub "$uid" > ../out/token
          test -s ../out/token
      - name: 3. fetch the example's data
        run: |
          cd tour && . .venv/bin/activate
          ASSET="$BUNDLE"
          URL="${BUNDLE_URL:-https://github.com/Percolation-Labs/percolate/releases/download/$TAG/$ASSET}"
          echo "bundle: $URL" | tee ../out/03-fetch-url.txt
          curl -fsSL -o "$ASSET" "$URL"
          echo "$BUNDLE_SHA256  $ASSET" | sha256sum -c - | tee ../out/03-fetch.txt
          tar xzf "$ASSET"
          { for d in $SAMPLES; do percolate sample load "$d"; done
            # the walks index every conversation channel the samples registered, then the walks load (they start
            # each walk offline from its recorded verdicts, so the links must exist first)
            for c in $(psql "$P8_DSN" -Atc "select name from content.channels where name like 'beam-%' order by 1"); do
              percolate walk index --source "$c"; done
            for d in $WALKS; do percolate sample load "$d"; done; } 2>&1 | tee -a ../out/03-fetch.txt
      - name: 3b. the default embedding model is bge-small, registered once (cory's test could not cover a fresh install)
        run: |
          psql "$P8_DSN" -c "select name, dim, provider, is_default from aiq.embedding_models order by name" | tee out/03b-models.txt
          test "$(psql "$P8_DSN" -Atc "select name from aiq.embedding_models where is_default")" = bge-small-en-v1.5
          test "$(psql "$P8_DSN" -Atc "select count(*) from aiq.embedding_models where is_default")" = 1
      - name: 3c. every walk runs to the end (its question step embeds through the stack's own service)
        run: |
          for i in $(seq 1 360); do
            n=$(psql "$P8_DSN" -Atc "select count(*) from aiq.walk_runs where status in ('running', 'pending', 'ready')")
            [ "$n" = 0 ] && break; sleep 10
          done
          psql "$P8_DSN" -c "select status, count(*) from aiq.walk_runs group by 1 order by 1" | tee out/03c-walks.txt
          test "$(psql "$P8_DSN" -Atc "select count(*) from aiq.walk_runs where status <> 'succeeded'")" = 0
          test "$(psql "$P8_DSN" -Atc "select count(*) from aiq.walk_runs")" -gt 0
      - name: 3d. what each replayed walk held (diagnostic; 3e is the test)
        run: |
          # walk_clues says 'unjudged' when the plain verdict map has no P for a lead. A stack-on walk keeps its
          # verdicts per open question (L| keys), so that count is not the replay's test: walk_summary's is (3e).
          psql "$P8_DSN" -c "select r.run, (select count(*) filter (where c.decision = 'unjudged') from aiq.walk_clues(r.run) c) as clues_without_plain_p,
                                    aiq.walk_summary(r.run)->'decider' as decider
                               from aiq.walk_runs r where r.replays is not null order by r.created_at" | tee out/03d-replays.txt
          # every lead a replay has no plain P for, with the wave that raised it beside the walk's last wave, and
          # whether the shipped replay holds a verdict for it under any key: a lead raised in the last wave that the
          # recording never judged is benign; one the recording judged but the replay lacks is a changed graph (bill)
          psql "$P8_DSN" -c "select r.run, c.key, c.kind, c.wave, (select max(w.wave) from aiq.walk_waves(r.run) w) as last_wave,
                                    (aiq.walk_summary(r.run)->'decider'->>'replay') as replay
                               from aiq.walk_runs r cross join lateral aiq.walk_clues(r.run) c
                              where r.replays is not null and c.decision = 'unjudged'
                                and coalesce((aiq.walk_summary(r.run)->'decider'->>'verdicts_held')::int, 0) >= 0
                                and (select count(*) from aiq.walk_clues(r.run) c2 where c2.decision = 'unjudged') < 200
                              order by r.run, c.wave, c.key" | tee out/03d-unjudged-leads.txt
          psql "$P8_DSN" -c "select r.run, c.wave, count(*) as unjudged_leads, (select max(w.wave) from aiq.walk_waves(r.run) w) as last_wave
                               from aiq.walk_runs r cross join lateral aiq.walk_clues(r.run) c
                              where r.replays is not null and c.decision = 'unjudged'
                              group by r.run, c.wave order by r.run, c.wave" | tee out/03d-unjudged-by-wave.txt
      - name: 3e. every replayed walk matches its recording (the bundle's walks/check.sql; a row that is not a pass fails)
        run: |
          # check.sql compares each replay's reads and clues with the recording's digests the bundle ships, and says
          # which kind of pass: 'faithful', or 'exact replay of a partial recording' (a walk that stopped before judging
          # its last wave is partial in the recording and the replay alike, bill 29 Oct). Anything else fails.
          cd tour
          : > ../out/03e-check.txt
          for d in $WALKS; do
            [ -f "$d/check.sql" ] || { echo "no check.sql in $d" | tee -a ../out/03e-check.txt; exit 1; }
            psql "$P8_DSN" -f "$d/check.sql" | tee -a ../out/03e-check.txt
            psql "$P8_DSN" -At -F '|' -f "$d/check.sql" >> ../out/03e-rows.txt
          done
          test -s ../out/03e-rows.txt || { echo "check.sql returned no rows"; exit 1; }
          bad=$(awk -F'|' '$5 !~ /^pass/' ../out/03e-rows.txt)
          [ -z "$bad" ] || { echo "not a pass:"; echo "$bad"; exit 1; }
          awk -F'|' '{print $5}' ../out/03e-rows.txt | sort | uniq -c | tee -a ../out/03e-check.txt
      - name: 4. the Walks screen answers
        run: |
          cd tour && . .venv/bin/activate
          export P8_UI_REST_URL=http://localhost:3000 P8_UI_CORE_URL=http://localhost:8080 P8_UI_CONTENT_URL=http://localhost:8081
          nohup percolate ui serve --host 127.0.0.1 --port 8082 > ../out/04-ui.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8082/ > ../out/04-ui.html && break; sleep 2; done
          grep -qi walks ../out/04-ui.html
      - name: 4b. the app serves its icon, and the Walks screen lists the walks and opens one, signed in as the reader (a headless browser has no tab strip, so the tab icon itself is the Mac leg's)
        run: |
          curl -fsS -o out/favicon.svg -w '%{http_code} %{content_type}\n' http://127.0.0.1:8082/favicon.svg | tee out/04b-favicon.txt
          grep -q '^200 image/svg+xml' out/04b-favicon.txt
          grep -Eiq '<link[^>]+rel="?(shortcut )?icon"?[^>]+favicon\.svg|<link[^>]+favicon\.svg[^>]+rel="?icon' out/04-ui.html
          cd tour && . .venv/bin/activate && pip -q install playwright && python -m playwright install --with-deps chromium > /dev/null
          # signed out, the screen shows no walk; signed in with the reader's token, it lists them and one opens
          export WALKS_N=$(psql "$P8_DSN" -Atc "select least(count(*), 50) from aiq.walk_runs")
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          token, want = open("../out/token").read().strip(), int(os.environ["WALKS_N"])
          rows = "a[href^='#/walk/']"
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 1400, "height": 900})
              pg.goto("http://127.0.0.1:8082/#/walks"); pg.wait_for_timeout(3000)
              icon = pg.evaluate("[...document.querySelectorAll('link[rel~=icon]')].map(l => l.href)")
              print("icon links:", icon); assert any(h.endswith("/favicon.svg") for h in icon), icon
              out = pg.locator(rows).count(); print("signed out, walks listed:", out); assert out == 0, out
              ctx = b.new_context(viewport={"width": 1400, "height": 900})
              ctx.add_init_script(f"sessionStorage.setItem('p8-token', {token!r})")
              pg = ctx.new_page(); pg.goto("http://127.0.0.1:8082/#/walks")
              pg.wait_for_selector(rows, timeout=30000); pg.wait_for_timeout(1000)
              pg.screenshot(path="../out/04b-walks.png", full_page=True)
              got = pg.locator(rows).count(); print(f"signed in, walks listed: {got} of {want}"); assert got == want, (got, want)
              pg.locator(rows).first.click()
              pg.get_by_text("Spend", exact=True).first.wait_for(timeout=60000); pg.wait_for_timeout(2000)
              pg.screenshot(path="../out/04b-walk.png", full_page=True)
              text = pg.inner_text("body")
              for panel in ("Question stack", "Waves", "Spend"):
                  assert panel in text, panel
              assert "query layer (REM-1245)" not in text, "a query-layer gap on the walk's screen"
              print("one walk: its panels render, no query-layer gap")
              b.close()
          PY
      - name: 5. query it from psql
        run: |
          psql "$P8_DSN" -c "select run, question_text, status from aiq.walk_runs order by created_at" | tee out/05-psql.txt
      - name: 5b. the query MCP server answers the reader's token (Claude itself is the Mac leg)
        run: |
          T=$(cat out/token)
          H=(-H "Authorization: Bearer $T" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream')
          curl -fsS http://127.0.0.1:8090 "${H[@]}" -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"tour","version":"0"}}}' | tee out/05b-mcp-init.txt
          curl -fsS http://127.0.0.1:8090 "${H[@]}" -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | tee out/05b-mcp-tools.txt | head -c 2000
          grep -q '"tools"' out/05b-mcp-tools.txt
      - name: keep what each step printed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-${{ github.run_id }}
          path: out/
