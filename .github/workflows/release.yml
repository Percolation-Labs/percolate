# Cut an EXTENSION release: the schema, the parsers, the image that bakes them.
#
# The counterpart to percolate-core's release.yml, and deliberately a separate
# button. The two move on their own clocks -- a worker fix and a schema change
# are not the same event and should not force each other's version -- which is
# the whole reason the repositories are separate in the first place.
#
# The version lives HERE because the source does. `percolate.control`'s
# `default_version` is what Postgres itself reads to answer "what version is
# this extension", so it is the one home; build-sql.py reads it rather than
# restating it, and the bump script moves it along with percolate_parser's
# control file and Cargo.toml.
#
# The BUILD lives in get-percolate, and that split is not arbitrary: the .so is
# compiled natively per platform on runners this repository cannot reach (macOS
# and arm64), the release has to be PUBLIC for `install.sh` to curl it, and
# this repository is private. So this workflow owns the number and dispatches
# the build, then waits for it -- waiting rather than firing and forgetting,
# because a green run here that means "a build started somewhere" is worse than
# no signal at all.
#
# ---------------------------------------------------------------------------
# THE ORDER, WHICH IS THE WHOLE DESIGN
#
# A release touches four systems and none of them share a transaction, so the
# property to aim for is not atomicity -- it is that every stop is a state the
# next run can finish from, and that nothing claims a version exists until it
# does.
#
#   preflight   can refuse; changes nothing
#   bump        a commit on main, UNTAGGED -- which check-version.sh already
#               calls "unreleased" and passes
#   build       the compilers, the assets, the image; the irreversible part
#   TAG         last, and only now
#
# The tag therefore means PUBLISHED, not ATTEMPTED. It used to be third: a build
# that failed left `v<version>` on origin for something nobody could download,
# and the "refuse to re-release" check then blocked the retry, so recovering
# meant deleting a tag by hand. Now a failed run leaves a bumped, untagged tree,
# and running it again publishes THAT version rather than burning a new number.
#
# `publish: false` is a real dry run rather than a skip: it dispatches the same
# build with an empty version, so the compilers and the image build actually run
# and nothing is released, pushed or tagged. A dry run that skipped the dispatch
# was exercising the one part that never fails.
#
# ---------------------------------------------------------------------------
# Configured once:
#   gh secret set P8_RELEASE_TOKEN    # PAT: actions+issues write on
#                                     # get-percolate, issues write on
#                                     # percolate-core. One token, three repos.
# ---------------------------------------------------------------------------
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: which part of the extension version to bump
        type: choice
        options: [minor, patch, major]
        default: minor
      publish:
        description: >-
          publish for real. Off is a real dry run: the compilers and the image
          build actually run on get-percolate, and nothing is released, pushed
          or tagged.
        type: boolean
        default: true
      force_bump:
        description: >-
          move the number even though the tree already carries an unreleased
          one. Off (the default) retries the unfinished version instead, which
          is what converges after a failed release.
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.P8_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write        # commit the bump, push the tag
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}

      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}

      # build-sql.py compiles specs/contract/types/*.yaml into the percolate.types
      # rows. A BUILD-time dependency only: the generated SQL carries the
      # shapes as jsonb, so installing the extension needs no Python at all.
      - run: pip install pyyaml

      # ---------------------------------------------------------------
      # PREFLIGHT -- everything that can refuse, before anything mutates.
      #
      # The order here used to be bump, commit, TAG, push, then build. A build
      # that failed left `v<version>` on origin for something nobody could
      # download, and the "refuse to re-release" check then blocked the retry,
      # so recovering meant deleting a tag by hand. The tag now means PUBLISHED
      # rather than ATTEMPTED, which is what dev/check-version.sh already
      # assumed, and it is the last thing to move rather than the first.
      # ---------------------------------------------------------------
      - name: Preflight
        id: pre
        env:
          GH_TOKEN: ${{ secrets.P8_RELEASE_TOKEN }}
          REPO: ${{ vars.CHART_REPO || 'Percolation-Labs/get-percolate' }}
          SELF: ${{ github.repository }}
        run: |
          # Checked HERE, not after the commit. Discovering a missing token
          # three steps in is how the tree ends up bumped for a release that
          # never happened.
          [ -n "$GH_TOKEN" ] || {
            echo "::error::P8_RELEASE_TOKEN is not set -- nothing has been changed. Set it and run again." >&2
            exit 1; }
          gh api "repos/$REPO" --jq .full_name >/dev/null || {
            echo "::error::P8_RELEASE_TOKEN cannot reach $REPO -- nothing has been changed." >&2
            exit 1; }
          # The SAME PAT pushes the tag at the end of this workflow, and against
          # THIS repository rather than $REPO -- so `repos/$REPO` above proved
          # the wrong half. The tag is deliberately the last thing to move, so a
          # token that cannot push here fails with the assets and the image
          # already published; that is the expensive corner this check exists to
          # keep the run out of.
          #
          # Reachability is not enough, because read and write come apart: a
          # fine-grained PAT can list a repository it cannot push to. Ask for the
          # capability the tag step actually needs. A repo it cannot see at all
          # fails the same way, gh exiting non-zero and printing nothing.
          #
          # Untested until it mattered: these repositories moved owner, and a
          # redirect follows a moved repository while a fine-grained PAT's
          # resource list does not follow it anywhere.
          gh api "repos/$SELF" --jq .permissions.push | grep -qx true || {
            echo "::error::P8_RELEASE_TOKEN cannot push to $SELF, which the tag step needs -- nothing has been changed." >&2
            exit 1; }

          CUR=$(sed -n "s/^default_version = '\(.*\)'/\1/p" extension/percolate/percolate.control)
          # An unreleased version in the tree is a release that did not finish,
          # not a reason to burn another number. Retrying it is what converges;
          # bumping again would leave a hole in the sequence for every failure.
          if git rev-parse -q --verify "refs/tags/v$CUR" >/dev/null; then
            echo "mode=bump" >> "$GITHUB_OUTPUT"
            echo "v$CUR is published; this run will bump ${{ inputs.bump }}"
          else
            echo "mode=retry" >> "$GITHUB_OUTPUT"
            echo "version=$CUR" >> "$GITHUB_OUTPUT"
            echo "::notice::$CUR is in the tree and untagged -- publishing THAT rather than bumping. Set force_bump to move the number instead."
          fi

      - name: Bump the extension version
        id: bump
        if: steps.pre.outputs.mode == 'bump' || inputs.force_bump
        # FIVE files -- two control files, Cargo.toml, the generated script
        # whose NAME is the version, and the kind manifest that mounts it by
        # that name. The script refuses to bump if the two extensions have
        # drifted apart, rather than silently reuniting them.
        #
        # It said "four" while the script had written five since the manifest
        # was added, which is the same off-by-one the commit step below had.
        run: python .github/scripts/bump_extension_version.py "${{ inputs.bump }}"

      - name: The version this run publishes
        id: v
        run: |
          V="${{ steps.bump.outputs.version || steps.pre.outputs.version }}"
          [ -n "$V" ] || { echo "::error::no version resolved" >&2; exit 1; }
          git rev-parse -q --verify "refs/tags/v$V" >/dev/null \
            && { echo "::error::v$V is already published" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "publishing $V"

      # EVERY TREE GATE, NOT TWO OF THEM -- the same list `check.sh` runs on
      # every push, run here by the same command. There is no second list.
      #
      # It runs HERE, after the bump, because before it the tree is at the old
      # version and perfectly consistent: the whole class of defect these catch
      # is created BY the bump, and that is the one moment the tree is
      # deliberately inconsistent for three steps.
      #
      # This used to be two named steps, `build-sql.py --check` and
      # `dev/references.sh`, added one at a time to the workflow whose failure
      # somebody happened to be looking at. Two of ten is how the most
      # consequential write in the repository -- the one that renames the
      # extension's generated SQL and every path that mounts it -- ended up the
      # write subject to the fewest checks. `references.sh` was added after
      # 0.1.6 published with `k8s/kind/manifests/postgres.yaml` still mounting
      # `percolate--0.1.5.sql`, so main went red one commit after the release
      # went green; its postmortem
      # (`meta/postmortems/2026-09-06-the-release-ran-fewer-gates-than-a-push.md`)
      # named the remaining eight as a known hole and said what to do about a
      # second instance: "the fix is `check.sh --tree` wholesale rather than a
      # third individual step". This is that.
      #
      # A gate that exists and is not on the release path is a gate the release
      # does not have.
      #
      # --tree ONLY, and the boundary is not laziness: the database half needs a
      # container and a loaded database, which this job has neither of and which
      # `check.yml`'s `database` job already runs against every push that
      # reaches main. What was missing was never the expensive half.
      #
      # The environment this needs is the environment this job already had --
      # `fetch-depth: 0` (check-version.sh asks whether HEAD is past a tag),
      # python 3.12 and pyyaml -- which is why this is a swap rather than a
      # cost.
      - name: Every gate a push runs, on the tree this release is about to publish
        run: dev/check.sh --tree

      # The bump lands on main WITHOUT a tag. That is a state the collection
      # already understands -- dev/check-version.sh calls it "unreleased" and
      # passes -- so a failure after this point leaves the tree in a shape that
      # is honest and that the next run picks up and finishes.
      - name: Commit the bump
        if: inputs.publish && steps.bump.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `extension/` AND the kind manifest, because the bump script writes
          # five files and this used to stage four. `bump_extension_version.py`
          # calls the manifest "the FIFTH file carrying the number, and the one
          # that drifted", updates it, and prints
          # `k8s/kind/manifests/postgres.yaml: 2 mount reference(s) -> <v>` --
          # and that write was then thrown away with the runner, because it
          # lives outside `extension/`. So 0.1.6 published with the manifest
          # still mounting `percolate--0.1.5.sql`: a kind cluster brought up
          # from this tree would bind a path the image no longer contains.
          #
          # Caught by `dev/references.sh`, a gate that ran on push and not on
          # this path -- so the release went green and main went red one commit
          # later. That gate now runs above, immediately after the bump, which
          # is the half that generalises: staging one more path fixes the file
          # that drifted, and running the check fixes the next one.
          #
          # And every other file the bump rewrote. It also moves the paths that name the generated script in specs
          # and board cards (six files on 19 September), which the tree gate above sees in the working tree and
          # a narrower stage then left behind. The runner's checkout is clean, so -A stages the bump and nothing else.
          git add -A
          git diff --cached --quiet || git commit -m "extension ${{ steps.v.outputs.version }}: bump"
          git push origin HEAD:"${{ github.ref_name }}"

      - name: The commit being built
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # THE ONLY IRREVERSIBLE PART, AND IT RUNS BEFORE THE TAG.
      #
      # Dispatched against the SHA rather than a tag, because there is no tag
      # yet -- that is the point. On `publish: false` the same dispatch goes out
      # with an EMPTY version, which parser.yml treats as build-only: the real
      # compilers, the real image build, no release and no pushed tag. A dry run
      # that skipped the dispatch was testing the one part that never fails.
      # ---------------------------------------------------------------
      - name: Build on get-percolate (and publish, unless this is a dry run)
        id: build
        env:
          GH_TOKEN: ${{ secrets.P8_RELEASE_TOKEN }}
          REPO: ${{ vars.CHART_REPO || 'Percolation-Labs/get-percolate' }}
          V: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          if [ "${{ inputs.publish }}" = "true" ]; then
            DISPATCH_V=$V; PUSH=true; WANT="extension $V"
          else
            # parser.yml names its run after `version || ref`, so a build-only
            # run is found by the SHA it was given.
            DISPATCH_V=""; PUSH=false; WANT="extension $SHA"
          fi
          gh workflow run parser.yml --repo "$REPO" \
            -f ref="$SHA" -f version="$DISPATCH_V" -f push_image="$PUSH"

          # `gh workflow run` does not return the run id -- there isn't one yet
          # -- so the run is found by NAME. parser.yml sets
          # `run-name: extension <version or ref>`, which is unique to this
          # dispatch; matching it cannot pick up a different run the way "newest
          # run created after I dispatched" could, and that mattered because the
          # consequence was watching one release and reporting its result as
          # another's.
          id=""
          for _ in $(seq 1 30); do
            sleep 5
            id=$(gh run list --repo "$REPO" --workflow parser.yml \
                   --limit 20 --json databaseId,displayTitle \
                   --jq "[.[] | select(.displayTitle == \"$WANT\")][0].databaseId // empty")
            [ -n "$id" ] && break
          done
          [ -n "$id" ] || {
            echo "::error::dispatched parser.yml on $REPO but no run appeared within 150s -- nothing is tagged, so running this again resumes where it stopped. Check $REPO/actions" >&2
            exit 1; }

          echo "watching https://github.com/$REPO/actions/runs/$id"
          gh run watch "$id" --repo "$REPO" --exit-status

      # ---------------------------------------------------------------
      # THE COMMIT POINT. Everything above can fail and leave a tree that the
      # next run finishes; past here the version is published and the tag says
      # so. Nothing else in the collection treats a version as spent until this
      # exists -- dev/check-version.sh, build-sql.py's upgrade scripts and
      # check.yml's upgrade gates all read the tags.
      # ---------------------------------------------------------------
      # PUSHED WITH THE PAT, BECAUSE GITHUB_TOKEN MAY NOT TOUCH A WORKFLOW FILE.
      #
      # 0.1.3 published everything and then failed here:
      #
      #   ! [remote rejected] v0.1.3 -> v0.1.3 (refusing to allow a GitHub App
      #     to create or update workflow `.github/workflows/check.yml` without
      #     `workflows` permission)
      #
      # The commit being tagged touched `.github/workflows/`, and a GitHub App
      # token -- which GITHUB_TOKEN is -- is refused any ref push carrying a
      # workflow change, tags included. There is no `workflows:` scope to add to
      # the `permissions:` block above; the restriction is on the token kind, not
      # on its grants. Every earlier release tagged a commit that happened not to
      # touch those files, so this sat unfound until a release cycle that did.
      #
      # It is the worst-shaped failure this workflow has: everything before it is
      # irreversible and had already succeeded, so the assets and the image were
      # public while the tag that says so did not exist -- precisely the state
      # the tag-last ordering exists to prevent. Re-running would have rebuilt
      # and republished, then failed at the same line.
      #
      # P8_RELEASE_TOKEN is a user PAT and can push workflow changes. It is
      # already required by this workflow -- Preflight refuses without it -- so
      # this adds a use, not a secret.
      - name: Tag it, now that it exists
        if: inputs.publish
        env:
          GH_PAT: ${{ secrets.P8_RELEASE_TOKEN }}
        run: |
          V=${{ steps.v.outputs.version }}
          # Set HERE and not only in the bump step, which is skipped whenever
          # this run is finishing a version the tree already carries -- exactly
          # the path a retry takes. `git tag -a` needs an identity, so the first
          # real retry died on `fatal: empty ident name` with everything else
          # already published.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "percolate extension $V" ${{ steps.sha.outputs.sha }}
          git push "https://x-access-token:$GH_PAT@github.com/${{ github.repository }}" "v$V"
          echo "::notice::v$V tagged -- the assets and image it names are already published"

      # OPEN THE NEXT VERSION, so main is never on a tagged number (REM-542). A change to extension/ under a
      # tagged version is refused by dev/check-version.sh, so until this step every first change after a release had
      # to bump, and two sessions bumping, or one tagging while another's change was in review, collided three times
      # on 18-19 September (meta/postmortems/2026-09-19-a-night-the-checks-did-not-run.md §2). Now the release that
      # spends a number opens the next one, a change never bumps, and the next run publishes what the tree carries.
      # From the latest main, because main moved while this built; a push that loses the race is retried from the
      # new main. A main already past this version (somebody opened it by hand) is left alone.
      - name: Open the next version on main
        if: inputs.publish
        run: |
          V=${{ steps.v.outputs.version }}
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin "${{ github.ref_name }}" --tags
            git checkout -q -B open-next "origin/${{ github.ref_name }}"
            CUR=$(sed -n "s/^default_version = '\(.*\)'/\1/p" extension/percolate/percolate.control)
            if [ "$CUR" != "$V" ]; then
              echo "::notice::main already carries $CUR, past v$V; nothing to open"
              exit 0
            fi
            python .github/scripts/bump_extension_version.py patch
            dev/check.sh --tree
            git add -A
            NEXT=$(sed -n "s/^default_version = '\(.*\)'/\1/p" extension/percolate/percolate.control)
            git commit -q -m "extension $NEXT: opened after v$V" -m "The release that tagged v$V moves main to the next patch, so no change has to bump (REM-542)."
            if git push origin HEAD:"${{ github.ref_name }}"; then
              echo "::notice::main opened at $NEXT"
              exit 0
            fi
            echo "main moved during the push; opening again from the new main (attempt $attempt)"
          done
          echo "::error::could not open the next version on main after three attempts; bump by hand with .github/scripts/bump_extension_version.py patch" >&2
          exit 1

      # THE FREEZE ENDS WITH THE RELEASE, tagged or failed (REM-536). A dry run
      # leaves it: the cut is still under way. dev/freeze.sh set is what froze it.
      - name: Clear the core freeze
        if: always() && inputs.publish
        env:
          GH_PAT: ${{ secrets.P8_RELEASE_TOKEN }}
        run: |
          for r in $(git ls-remote --refs origin 'refs/freeze/*' | awk '{print $2}'); do
            git push "https://x-access-token:$GH_PAT@github.com/${{ github.repository }}" ":$r"
            echo "::notice::cleared ${r#refs/freeze/}"
          done

      - name: Summary
        run: |
          V=${{ steps.v.outputs.version }}
          {
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo "### percolate extension $V published"
              echo ""
              echo "Assets and image built from \`${{ steps.sha.outputs.sha }}\`, then tagged \`v$V\` --"
              echo "in that order, so a failure anywhere above leaves an untagged bump the next run finishes"
              echo "rather than a tag for something nobody can download."
              echo ""
              echo "get-percolate's \`versions.toml\` moved with it, and its pages carry no version literals,"
              echo "so there is nothing left to chase."
            else
              echo "### dry run: $V built, nothing published"
              echo ""
              echo "The real compilers and the real image build ran on get-percolate against"
              echo "\`${{ steps.sha.outputs.sha }}\`. No release, no image push, no tag, no commit."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
