# EVERY GATE, AS ONE WORKFLOW THAT RUNS ONE SCRIPT.
#
# This replaced `specs.yml` and `suite.yml`, which between them held thirteen
# named steps restating what `dev/check.sh` already does. The restatement was
# the defect: the local set and the CI set were two lists, they drifted, and the
# drift cost a round trip in 68167c1 when a developer ran `references.sh` and
# reasonably assumed it covered `check-references.py`. A guard was written to
# compare the two lists; the guard was then deleted along with the second list,
# because keeping two copies in step is what you do when you have not noticed
# you could have one.
#
# So: the jobs below run `dev/ci-database.sh` and `dev/check.sh`, which are the
# same two commands a developer runs. There is nothing here to fall behind.
#
# SPLIT BY COST RATHER THAN BY SUBJECT. The tree job needs no Docker and
# finishes in seconds, so it fails fast on the cheap mistakes; the database job
# pulls an image; the parser job compiles Rust and the database job waits on it;
# the self-model job is minutes. They run in parallel, which is what the two
# workflows this replaced were really buying.
#
# THE PARSER JOB IS THE EXPENSIVE ONE AND IT BOUGHT SOMETHING. Before it, the
# database job ran the PUBLISHED .so and refused any PR touching the crate --
# honest, and it meant a parser change could not have a green check, so six
# commits accumulated unshipped since v0.1.6 and the assertions that need them
# never ran here. It compiles what parser-tests.yml already compiles, restoring
# the same two caches by the same keys, and hands the database job a .so built
# from this tree. What that job tests is now the PAIR.
#
# WHAT THIS COSTS, MEASURED. The suite is seven seconds; installing the
# extension and seeding is two; the container is healthy in one. Most of the
# remainder is `workflow/03` waiting for a real pg_cron tick. The rest is
# pulling the image -- which is why `dev/Dockerfile.pg19` became a two-stage
# build, taking it from 1.94 GB to 654 MB. Do not add work here without
# measuring it; this is affordable because it does almost nothing.
#
# IF BILLING RUNS OUT, nothing about how any of this gets run has to change:
#
#     dev/ci-database.sh && CONTAINER=p8-ci DB=p8ci dev/check.sh
#
# and `dev/githooks/pre-push` runs `dev/check.sh` on every push if you point git
# at it.
name: check

on:
  pull_request:
    paths-ignore: ['**.md']
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything answerable from the tree alone. No Docker, no database, seconds.
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, and the history between them: "is HEAD past the tag for this
          # version" is a question a shallow clone cannot answer, and a check
          # that silently cannot run is the failure this repository keeps
          # finding in other shapes.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # build-sql.py compiles specs/contract/types/*.yaml. A BUILD-time
      # dependency only -- the generated SQL carries the shapes as jsonb, so
      # installing the extension needs no Python at all.
      - run: pip install --quiet pyyaml
      - run: dev/check.sh --tree

  # THE COMPILED HALF, BUILT FROM THIS TREE.
  #
  # The database job used to refuse any PR touching extension/percolate_parser,
  # because it runs the PUBLISHED .so and could not honestly claim to have
  # tested a parser change. That refusal was correct and it made a parser change
  # unmergeable on a green check; the standing cost is worse than it sounds,
  # because six parser commits have accumulated since v0.1.6 and the assertions
  # they need -- including query/11, whose stated purpose is that the compiled
  # adjacency snapshot cannot serve one tenant's graph to another -- have not
  # run against them in CI once.
  #
  # WHAT MAKES THIS AFFORDABLE, and it is not new work. parser-tests.yml already
  # compiles this crate on this runner and already caches the two expensive
  # things: the pgrx toolchain image (cargo-pgrx is compiled from source, 257s
  # of a 343s cold job, and pgrx ships no binaries to fetch instead) and the
  # crate's target directory. This job restores both by the same keys, so on a
  # warm cache it is a cargo no-op plus a docker load. The keys are IDENTICAL to
  # that workflow's on purpose -- two spellings of one cache key is the
  # duplication this collection keeps finding, and here it would show up as a
  # permanent cold build rather than as a wrong answer.
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the crate build
        uses: actions/cache@v4
        with:
          path: extension/percolate_parser/target-ci
          key: parser-package-${{ hashFiles('dev/Dockerfile.pgrx-builder', 'extension/percolate_parser/Cargo.lock') }}
          restore-keys: parser-package-

      # No restore-keys, for parser-tests.yml's reason: an image restored under
      # a changed Dockerfile is the wrong toolchain, and it would surface as a
      # red test rather than as a cache miss.
      - name: Cache the pgrx toolchain image
        id: toolchain
        uses: actions/cache@v4
        with:
          path: /tmp/pgrx-builder.tar
          key: pgrx-builder-image-${{ hashFiles('dev/Dockerfile.pgrx-builder') }}

      - name: Build the pgrx toolchain image
        if: steps.toolchain.outputs.cache-hit != 'true'
        working-directory: dev
        run: |
          docker build -f Dockerfile.pgrx-builder -t pgrx-builder .
          docker save pgrx-builder -o /tmp/pgrx-builder.tar

      - name: Load the pgrx toolchain image
        if: steps.toolchain.outputs.cache-hit == 'true'
        run: docker load -i /tmp/pgrx-builder.tar

      # `package`, not `test`: parser-tests.yml runs the crate's own tests and
      # this produces the artefact the database job installs. The same command
      # dev/build-image.sh runs, against the same base image, so the ABI is the
      # one the published container expects.
      - name: cargo pgrx package
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/extension/percolate_parser":/work \
            -e PGRX_HOME=/work/.pgrx -e CARGO_TARGET_DIR=/work/target-ci \
            -w /work pgrx-builder bash -c '
              set -euo pipefail
              cargo pgrx init --pg19 /usr/bin/pg_config >/dev/null 2>&1 || true
              cargo pgrx package --features pg19 --no-default-features \
                --pg-config /usr/bin/pg_config'
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/extension/percolate_parser"

      # The three files ci-database.sh's PARSER_DIST wants, in the layout it
      # wants them. Named here rather than in the consumer so a change to what
      # pgrx emits fails in the job that ran pgrx.
      - name: Collect the dist
        run: |
          B=extension/percolate_parser/target-ci/release/percolate_parser-pg19
          mkdir -p parser-dist
          cp "$B/usr/lib/postgresql/19/lib/percolate_parser.so" parser-dist/
          cp "$B"/usr/share/postgresql/19/extension/percolate_parser* parser-dist/
          ls -l parser-dist
          grep default_version parser-dist/percolate_parser.control

      - uses: actions/upload-artifact@v4
        with:
          name: parser-dist
          path: parser-dist/
          retention-days: 1

  database:
    runs-on: ubuntu-latest
    env:
      CONTAINER: p8-ci
      DB: p8ci
    needs: parser
    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade gate resolves the release it upgrades FROM by reading
          # tags, and ci-database.sh picks its image the same way.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml

      # THE COMPILED HALF, FROM THE `parser` JOB. This step is what replaced a
      # refusal: the job used to fail outright on any PR touching
      # extension/percolate_parser, because it ran the published .so and could
      # not claim to have tested the change. It now runs the one this tree
      # produced, so the pair -- this schema against this parser -- is what is
      # under test, and query/11 and query/15 stop deferring.
      #
      # The image still supplies everything else, so this remains the seconds-
      # long job its header describes; the minutes are the `parser` job's, in
      # parallel with `tree`, on a cache parser-tests.yml already warms.
      - uses: actions/download-artifact@v4
        with:
          name: parser-dist
          path: parser-dist

      - run: PARSER_DIST="$GITHUB_WORKSPACE/parser-dist" dev/ci-database.sh
      - run: dev/check.sh

      # THE DEFERRALS MUST BE GONE. dev/tests/run.sh defers a compiled assertion
      # only while pg_extension says the two halves disagree, and after the step
      # above they agree -- so a run that still reports one means the artefact
      # did not land and the suite passed without the assertions this job exists
      # to run. Green-because-it-looked-nowhere is the failure this collection
      # keeps finding; here is where it would hide.
      - name: The halves agree, so nothing may still be deferred
        run: |
          P=$(docker exec "$CONTAINER" psql -U p8 -d "$DB" -tAc \
              "select extversion from pg_catalog.pg_extension where extname='percolate_parser'")
          S=$(docker exec "$CONTAINER" psql -U p8 -d "$DB" -tAc \
              "select extversion from pg_catalog.pg_extension where extname='percolate'")
          echo "percolate $S, percolate_parser $P"
          [ "$P" = "$S" ] || {
            echo "::error::the parser artefact did not land: percolate_parser is $P and" \
                 "percolate is $S, so every compiled assertion deferred and this job" \
                 "reported green on a suite that skipped them"
            exit 1; }

      - name: What the database said, if it failed
        if: failure()
        run: docker logs "$CONTAINER" | tail -60

  # THE SELF-MODEL, REBUILT FROM THE REPOSITORY ALONE.
  #
  # A third job, split from the second for the reason the second was split from
  # the first: cost. This one is minutes rather than seconds, and the `database`
  # job's own comment says not to add work there without measuring. Measured on
  # this runner, 2026-09-12 (run 34668494624): 5m47s here, against 2m03s for
  # `database` and 16s for `tree`. Roughly two thirds of it is the load and the
  # rest `tests.sql`. The three run in parallel, so this costs wall clock only
  # where it is the slowest, which it is -- and it is still three times the
  # whole database job, which is why it is not a line inside it.
  #
  # WHY IT EXISTS. `applications/percolate-self-model/load.sh --from-zero` had
  # been broken since `492e007` and nobody noticed for a month, because every
  # load anybody runs is incremental against a database that already holds the
  # rows -- so the path that makes the self-model a rebuildable artifact rather
  # than a database somebody happens to still have was the one path nothing
  # exercised. Eight defects had accumulated in it (REM-74), every one invisible
  # to an incremental load by construction: what is missing is exactly what the
  # previous run left behind. load.sh's own ordering comment had already recorded
  # the mirror-image bug and drawn the conclusion -- "there are two load paths and
  # both have to be exercised" -- and then neither was exercised by CI. This is
  # that sentence, run.
  #
  # NO API KEY, ON PURPOSE. load.sh skips embed.py without one, which is a
  # supported state and therefore one worth testing: two of the eight defects
  # were steps downstream that had quietly made embeddings mandatory.
  self-model:
    runs-on: ubuntu-latest
    env:
      CONTAINER: p8-sm
      DB: p8sm
    steps:
      - uses: actions/checkout@v4
        with:
          # THE HISTORY, not a snapshot of it. ingest.py, symbol_touch.py and
          # metrics.sql all read git -- commits, per-file revisions, evolutionary
          # coupling -- so a shallow clone would load the self-model of a
          # repository with one commit in it and report success.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml
      - run: dev/ci-database.sh
      - run: dev/check.sh --self-model

      - name: What the database said, if it failed
        if: failure()
        run: docker logs "$CONTAINER" | tail -60
