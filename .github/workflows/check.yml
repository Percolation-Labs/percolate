# EVERY GATE, AS ONE WORKFLOW THAT RUNS ONE SCRIPT.
#
# This replaced `specs.yml` and `suite.yml`, which between them held thirteen
# named steps restating what `dev/check.sh` already does. The restatement was
# the defect: the local set and the CI set were two lists, they drifted, and the
# drift cost a round trip in 68167c1 when a developer ran `references.sh` and
# reasonably assumed it covered `check-references.py`. A guard was written to
# compare the two lists; the guard was then deleted along with the second list,
# because keeping two copies in step is what you do when you have not noticed
# you could have one.
#
# So: the jobs below run `dev/ci-database.sh` and `dev/check.sh`, which are the
# same two commands a developer runs. There is nothing here to fall behind.
#
# SPLIT BY COST RATHER THAN BY SUBJECT. The tree job needs no Docker and
# finishes in seconds, so it fails fast on the cheap mistakes; the database job
# pulls an image; the parser job compiles Rust and the database job waits on it;
# the self-model job is minutes. They run in parallel, which is what the two
# workflows this replaced were really buying.
#
# THE PARSER JOB IS THE EXPENSIVE ONE AND IT BOUGHT SOMETHING. Before it, the
# database job ran the PUBLISHED .so and refused any PR touching the crate --
# honest, and it meant a parser change could not have a green check, so six
# commits accumulated unshipped since v0.1.6 and the assertions that need them
# never ran here. It compiles what parser-tests.yml already compiles, restoring
# the same two caches by the same keys, and hands the database job a .so built
# from this tree. What that job tests is now the PAIR.
#
# WHAT THIS COSTS, MEASURED. The suite is seven seconds; installing the
# extension and seeding is two; the container is healthy in one. Most of the
# remainder is `workflow/03` waiting for a real pg_cron tick. The rest is
# pulling the image -- which is why `dev/Dockerfile.pg19` became a two-stage
# build, taking it from 1.94 GB to 654 MB. Do not add work here without
# measuring it; this is affordable because it does almost nothing.
#
# IF BILLING RUNS OUT, nothing about how any of this gets run has to change:
#
#     dev/ci-database.sh && CONTAINER=p8-ci DB=p8ci dev/check.sh
#
# and `dev/githooks/pre-push` runs `dev/check.sh` on every push if you point git
# at it.
name: check

on:
  pull_request:
    paths-ignore: ['**.md']
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything answerable from the tree alone. No Docker, no database, seconds.
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, and the history between them: "is HEAD past the tag for this
          # version" is a question a shallow clone cannot answer, and a check
          # that silently cannot run is the failure this repository keeps
          # finding in other shapes.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # build-sql.py compiles specs/contract/types/*.yaml. A BUILD-time
      # dependency only -- the generated SQL carries the shapes as jsonb, so
      # installing the extension needs no Python at all.
      - run: pip install --quiet pyyaml
      - run: dev/check.sh --tree

  # THE COMPILED HALF, BUILT FROM THIS TREE.
  #
  # The database job used to refuse any PR touching extension/percolate_parser,
  # because it runs the PUBLISHED .so and could not honestly claim to have
  # tested a parser change. That refusal was correct and it made a parser change
  # unmergeable on a green check; the standing cost is worse than it sounds,
  # because six parser commits have accumulated since v0.1.6 and the assertions
  # they need -- including query/11, whose stated purpose is that the compiled
  # adjacency snapshot cannot serve one tenant's graph to another -- have not
  # run against them in CI once.
  #
  # WHAT MAKES THIS AFFORDABLE, and it is not new work. parser-tests.yml already
  # compiles this crate on this runner and already caches the two expensive
  # things: the pgrx toolchain image (cargo-pgrx is compiled from source, 257s
  # of a 343s cold job, and pgrx ships no binaries to fetch instead) and the
  # crate's target directory. This job restores both by the same keys, so on a
  # warm cache it is a cargo no-op plus a docker load. The keys are IDENTICAL to
  # that workflow's on purpose -- two spellings of one cache key is the
  # duplication this collection keeps finding, and here it would show up as a
  # permanent cold build rather than as a wrong answer.
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache the crate build
        uses: actions/cache@v6
        with:
          path: extension/percolate_parser/target-ci
          key: parser-package-${{ hashFiles('dev/Dockerfile.pgrx-builder', 'extension/percolate_parser/Cargo.lock') }}
          restore-keys: parser-package-

      # THE SAME BASE THIS TOOLCHAIN IS BUILT ON, RESOLVED. Copied from
      # parser-tests.yml deliberately, and the gate `dev/check.sh` runs
      # ("Two workflows build one toolchain, under one key") keeps the two in
      # step -- because sharing a cache key is only safe while the two builds
      # are the same build.
      #
      # The tag is read out of the Dockerfile rather than written here twice, so
      # bumping the base stays a one-line edit in one file.
      - name: Resolve the base image the toolchain is built on
        id: base
        run: |
          TAG=$(sed -n 's/^FROM \([^ ]*\).*/\1/p' dev/Dockerfile.pgrx-builder | head -1)
          [ -n "$TAG" ] || { echo "::error::no FROM line in dev/Dockerfile.pgrx-builder"; exit 1; }
          # The INDEX digest, which moves when any platform's image moves.
          DIGEST=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::could not resolve a digest for $TAG (got '$DIGEST')"; exit 1 ;;
          esac
          echo "::notice::toolchain base $TAG is $DIGEST"
          echo "digest=${DIGEST#sha256:}" >> "$GITHUB_OUTPUT"

      # WHY THIS KEY IS CHARACTER-FOR-CHARACTER parser-tests.yml's, AND WHY THE
      # TRAILING DIGEST IS LOAD-BEARING FOR A REASON THAT IS NOT THE BASE IMAGE.
      #
      # THE COMMENT THIS REPLACES WAS FALSE, and it is the reason REM-142 exists.
      # It said: "No restore-keys, for parser-tests.yml's reason: an image
      # restored under a changed Dockerfile is the wrong toolchain." Omitting
      # `restore-keys` prevents only ADDITIONAL prefixes. **The primary key is a
      # restore prefix in its own right**, so this cache took a loose hit on
      # every run of this workflow -- and specifically on parser-tests.yml's
      # entry, because this key used to STOP where that one continued:
      #
      #     check.yml        pgrx-builder-image-<hash>              (ended here)
      #     parser-tests.yml pgrx-builder-image-<hash>-<digest>
      #
      # Logged every run as `Cache hit for restore-key:
      # pgrx-builder-image-4f5f0998...-c2f9db76...`, ~775 MB restored. And
      # because `cache-hit` is set only on an EXACT match it read `false`, so
      # BOTH guards below fired the wrong way: the build ran and rebuilt an
      # image already on disk, and the load was skipped so the 813 MB was never
      # used. The restored tarball being ignored is the only reason a toolchain
      # from another workflow's base digest was never actually loaded -- one bug
      # masking the other, which is why namespacing alone would have been a
      # regression rather than a fix (an exact hit makes the load start
      # happening, and without the digest here it would load a stale toolchain).
      #
      # SO THE FIX IS STRUCTURAL RATHER THAN NOMINAL. Both keys now end with the
      # same segment, so neither can be a PROPER prefix of the other: any
      # divergence in the hash makes the two differ mid-string instead of one
      # extending the other. A namespace prefix would have been a convention
      # somebody could bump; this is arithmetic.
      #
      # THE KEYS ARE NOW IDENTICAL, AND THAT IS THE POINT, not a collision.
      # These two workflows build the same image by the same command -- same
      # Dockerfile, same PGRX_VERSION read from the same Cargo.toml by the same
      # sed, same `docker save` to the same path -- so one entry legitimately
      # serves both, and an exact hit here means the toolchain genuinely
      # matches. Two runs no longer build it twice, which on a runner that
      # arrives 88% full (REM-140) is the same kind of saving as the reclaim.
      #
      # WHICH MAKES THE SHARING A PROMISE THAT HAS TO BE KEPT: it is sound only
      # while the two builds stay the same build. That is not a thing to
      # remember, so dev/check.sh asserts it -- if either key or either build
      # command drifts, the tree gate fails and names both files.
      #
      # AND Cargo.toml IS IN THE HASH, because the pgrx pin moved into it. The
      # toolchain image is a function of the Dockerfile AND the version passed
      # into it; keyed on the Dockerfile alone, bumping pgrx in the crate would
      # be a cache HIT on an image carrying the previous cargo-pgrx -- which
      # compiles, and produces a .so the crate does not match.
      - name: Cache the pgrx toolchain image
        id: toolchain
        uses: actions/cache@v6
        with:
          path: /tmp/pgrx-builder.tar
          key: pgrx-builder-image-${{ hashFiles('dev/Dockerfile.pgrx-builder', 'extension/percolate_parser/Cargo.toml') }}-${{ steps.base.outputs.digest }}

      # BOTH NUMBERS FROM THE CRATE THAT DECLARES THEM, once, so no step below
      # spells either. `Cargo.toml` says which pgrx this builds against and
      # which pg feature is default; every other line here used to restate one
      # or the other -- `--pg19`, `--features pg19`, two `/…/19/…` paths and the
      # toolchain build -- and `dev/build-image.sh` restated all of them again.
      # This job's whole claim is that it produces the artefact the published
      # container expects, which is false the moment one of those copies drifts.
      - name: The pg major and the pgrx pin, read from Cargo.toml
        id: pins
        run: |
          C=extension/percolate_parser/Cargo.toml
          M=$(sed -n 's/^default *= *\["pg\([0-9][0-9]*\)"\].*/\1/p' "$C")
          X=$(sed -n 's/^pgrx *= *"=\{0,1\}\([0-9][0-9.]*\)".*/\1/p' "$C")
          [ -n "$M" ] && [ -n "$X" ] || {
            echo "::error::could not read the pg major and the pgrx pin from $C" >&2
            exit 1; }
          echo "pg=$M"   >> "$GITHUB_OUTPUT"
          echo "pgrx=$X" >> "$GITHUB_OUTPUT"
          echo "pg$M, pgrx $X"

      # THE COLD PATH IS THE TIGHT ONE, and the first version of this fix missed
      # it. p8#132's own run took a cache MISS and died in the step below,
      # before any `df` line printed -- so the reclaim aimed at the load path
      # was aimed at a path that run never took. `docker save` needs the image
      # in the graph AND a ~2GB tarball beside it, which is 2x the image on the
      # cold path and the reason the save/load design is the thing under
      # pressure. That design is deliberate (parser-tests.yml's header) and is
      # not reversed here.
      #
      # So: reclaim what the runner ships and nothing here uses. These four
      # directories are the standard ~25GB on a GitHub-hosted runner, and this
      # job needs a Rust toolchain inside a container and nothing else from the
      # host. `|| true` on each because their presence is the runner image's
      # business and not a thing this job should assert.
      - name: Free what this job does not use
        run: |
          df -h / | tail -1 | sed 's/^/before reclaim: /'
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1 | sed 's/^/after reclaim:  /'

      - name: Build the pgrx toolchain image
        if: steps.toolchain.outputs.cache-hit != 'true'
        working-directory: dev
        run: |
          docker build -f Dockerfile.pgrx-builder \
            --build-arg PGRX_VERSION=${{ steps.pins.outputs.pgrx }} \
            -t pgrx-builder .
          # AND THE RESTORED TARBALL GOES BEFORE THE SAVE, which is where the
          # space actually went. MEASURED, run 34713089283 job 103605298996:
          #
          #   key:  pgrx-builder-image-4f5f0998…                (one segment)
          #   log:  Cache hit for restore-key:
          #           pgrx-builder-image-4f5f0998…-c2f9db76…    (two segments)
          #         Cache Size: ~775 MB (813031760 B)
          #
          # An older workflow saved this cache under a LONGER key, and the
          # current key is a prefix of it — so every run takes a restore-key
          # hit, lands an 813 MB tarball, and still reports `cache-hit: false`,
          # because actions/cache sets that only on an EXACT match. The load
          # step is skipped, the image is therefore not in the graph, the build
          # runs, and then `docker save` writes a second tarball while the
          # first is still on disk. 199 MB crate cache + 813 MB stale tarball +
          # the image in the graph + the new tarball = no space left, at
          # 19:12:03.
          #
          # Unconditional, and safe on both paths: here the file is either
          # stale from a prefix hit or absent, and the save is about to
          # overwrite it either way. actions/cache has not run its post-job
          # save yet, and the file it will save is the one written below.
          # Located by p8-subsystems-d1 reading this PR's log.
          df -h / | tail -1 | sed 's/^/before save:   /'
          rm -f /tmp/pgrx-builder.tar
          docker save pgrx-builder -o /tmp/pgrx-builder.tar
          df -h / | tail -1 | sed 's/^/after save:    /'

      # AND THE TARBALL GOES, because holding it through the build is what ran
      # the runner out of disk. This job keeps three large things at once on
      # ~14GB: the restored `parser-package` cache (target-ci and .pgrx), the
      # restored /tmp/pgrx-builder.tar, and the same image again expanded into
      # the Docker graph by the load below. `cargo pgrx package` then builds
      # into target-ci and dies -- measured on main's own run 34712571354,
      # `write /tmp/.docker_temp_2778519223: no space left on device`, seven
      # minutes after both caches restored. Four branches including main.
      #
      # DELETING IT CANNOT COST A CACHE WRITE, and that is why the rm lives in
      # this step rather than a later one: this step runs only on a cache HIT,
      # which is exactly when actions/cache skips its post-job save. On a MISS
      # the build step above creates the tarball and the save needs it, and
      # that path is untouched.
      #
      # `df` THREE TIMES, so the next failure is a measurement rather than a
      # guess. The reclaim is the largest thing available without reversing the
      # save/load design, whose reasoning is in parser-tests.yml's header --
      # and it is NOT established that it is enough. These numbers are what
      # would settle that, and what a buildx-layer-cache argument would start
      # from.
      - name: Load the pgrx toolchain image, then drop the tarball
        if: steps.toolchain.outputs.cache-hit == 'true'
        run: |
          df -h / | tail -1 | sed 's/^/before load:  /'
          docker load -i /tmp/pgrx-builder.tar
          rm -f /tmp/pgrx-builder.tar
          df -h / | tail -1 | sed 's/^/after reclaim: /'

      # `package`, not `test`: parser-tests.yml runs the crate's own tests and
      # this produces the artefact the database job installs. The same command
      # dev/build-image.sh runs, against the same base image, so the ABI is the
      # one the published container expects.
      - name: cargo pgrx package
        run: |
          df -h / | tail -1 | sed 's/^/before build: /'
          docker run --rm \
            -v "$GITHUB_WORKSPACE/extension/percolate_parser":/work \
            -e PGRX_HOME=/work/.pgrx -e CARGO_TARGET_DIR=/work/target-ci \
            -e PG=${{ steps.pins.outputs.pg }} \
            -w /work pgrx-builder bash -c '
              set -euo pipefail
              cargo pgrx init "--pg$PG" /usr/bin/pg_config >/dev/null 2>&1 || true
              cargo pgrx package --features "pg$PG" --no-default-features \
                --pg-config /usr/bin/pg_config
              # WHERE THE ARTEFACTS LANDED, asked of the server rather than
              # spelled here: pgrx writes the package under its own absolute
              # pkglibdir and sharedir, so the collect step below used to carry
              # two more copies of the major in two path literals. It now reads
              # three files from one flat directory and knows nothing about
              # Postgres layout.
              cp "/work/target-ci/release/percolate_parser-pg$PG$(pg_config --pkglibdir)/percolate_parser.so" \
                 /work/target-ci/
              cp "/work/target-ci/release/percolate_parser-pg$PG$(pg_config --sharedir)/extension/"percolate_parser* \
                 /work/target-ci/'
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/extension/percolate_parser"

      # The three files ci-database.sh's PARSER_DIST wants, in the layout it
      # wants them. Named here rather than in the consumer so a change to what
      # pgrx emits fails in the job that ran pgrx.
      - name: Collect the dist
        run: |
          B=extension/percolate_parser/target-ci
          mkdir -p parser-dist
          cp "$B"/percolate_parser* parser-dist/
          ls -l parser-dist
          grep default_version parser-dist/percolate_parser.control

      - uses: actions/upload-artifact@v7
        with:
          name: parser-dist
          path: parser-dist/
          retention-days: 1

  database:
    runs-on: ubuntu-latest
    env:
      CONTAINER: p8-ci
      DB: p8ci
    needs: parser
    steps:
      - uses: actions/checkout@v7
        with:
          # The upgrade gate resolves the release it upgrades FROM by reading
          # tags, and ci-database.sh picks its image the same way.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml

      # THE COMPILED HALF, FROM THE `parser` JOB. This step is what replaced a
      # refusal: the job used to fail outright on any PR touching
      # extension/percolate_parser, because it ran the published .so and could
      # not claim to have tested the change. It now runs the one this tree
      # produced, so the pair -- this schema against this parser -- is what is
      # under test, and query/11 and query/15 stop deferring.
      #
      # The image still supplies everything else, so this remains the seconds-
      # long job its header describes; the minutes are the `parser` job's, in
      # parallel with `tree`, on a cache parser-tests.yml already warms.
      - uses: actions/download-artifact@v8
        with:
          name: parser-dist
          path: parser-dist

      - run: PARSER_DIST="$GITHUB_WORKSPACE/parser-dist" dev/ci-database.sh
      - run: dev/check.sh

      # THE DEFERRALS GATE USED TO BE A STEP HERE, and it was the only gate in
      # this file. `dev/check.sh` above opens with "THERE IS NO SECOND LIST" and
      # this was one: `grep -c defer dev/check.sh` was 0 and `grep -n extversion
      # dev/check.sh` was empty, so running every gate the way that file
      # promises still did not run this one, on any machine. It is now
      # `db_deferrals_gone` in `DB_GATES`, which the line above runs -- and
      # `tree_no_gate_lives_only_in_ci` refuses the next one rather than
      # trusting this comment to be read.

      - name: What the database said, if it failed
        if: failure()
        run: docker logs "$CONTAINER" | tail -60

  # THE SELF-MODEL, REBUILT FROM THE REPOSITORY ALONE.
  #
  # A third job, split from the second for the reason the second was split from
  # the first: cost. This one is minutes rather than seconds, and the `database`
  # job's own comment says not to add work there without measuring. Measured on
  # this runner, 2026-09-12 (run 34668494624): 5m47s here, against 2m03s for
  # `database` and 16s for `tree`. Roughly two thirds of it is the load and the
  # rest `tests.sql`. The three run in parallel, so this costs wall clock only
  # where it is the slowest, which it is -- and it is still three times the
  # whole database job, which is why it is not a line inside it.
  #
  # WHY IT EXISTS. `applications/percolate-self-model/load.sh --from-zero` had
  # been broken since `492e007` and nobody noticed for a month, because every
  # load anybody runs is incremental against a database that already holds the
  # rows -- so the path that makes the self-model a rebuildable artifact rather
  # than a database somebody happens to still have was the one path nothing
  # exercised. Eight defects had accumulated in it (REM-74), every one invisible
  # to an incremental load by construction: what is missing is exactly what the
  # previous run left behind. load.sh's own ordering comment had already recorded
  # the mirror-image bug and drawn the conclusion -- "there are two load paths and
  # both have to be exercised" -- and then neither was exercised by CI. This is
  # that sentence, run.
  #
  # NO API KEY, ON PURPOSE. load.sh skips embed.py without one, which is a
  # supported state and therefore one worth testing: two of the eight defects
  # were steps downstream that had quietly made embeddings mandatory.
  self-model:
    runs-on: ubuntu-latest
    env:
      CONTAINER: p8-sm
      DB: p8sm
    steps:
      - uses: actions/checkout@v7
        with:
          # THE HISTORY, not a snapshot of it. ingest.py, symbol_touch.py and
          # metrics.sql all read git -- commits, per-file revisions, evolutionary
          # coupling -- so a shallow clone would load the self-model of a
          # repository with one commit in it and report success.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml
      - run: dev/ci-database.sh
      - run: dev/check.sh --self-model

      - name: What the database said, if it failed
        if: failure()
        run: docker logs "$CONTAINER" | tail -60
