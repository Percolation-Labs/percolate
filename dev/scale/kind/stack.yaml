apiVersion: v1
kind: Namespace
metadata: {name: p8}
---
apiVersion: v1
kind: Service
metadata: {name: pg, namespace: p8}
spec:
  selector: {app: pg}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pg, namespace: p8}
spec:
  replicas: 1
  selector: {matchLabels: {app: pg}}
  template:
    metadata: {labels: {app: pg}}
    spec:
      # Pin the database to the control plane so the load pods on the two
      # worker nodes genuinely cross the network to reach it.
      nodeSelector: {node-role.kubernetes.io/control-plane: ""}
      tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}]
      containers:
        - name: pg
          image: percolationlabs/percolate-postgres:19
          imagePullPolicy: Never
          args: ["postgres", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=p8experiment"]
          env:
            - {name: POSTGRES_USER, value: p8}
            - {name: POSTGRES_PASSWORD, value: p8}
            - {name: POSTGRES_DB, value: p8experiment}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            # TCP: the image's first-start install runs on a socket-only server,
            # so a socket probe is Ready before the extension exists.
            exec: {command: ["pg_isready", "-h", "127.0.0.1", "-U", "p8", "-d", "p8experiment"]}
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: claimer, namespace: p8}
spec:
  replicas: 0
  selector: {matchLabels: {app: claimer}}
  template:
    metadata: {labels: {app: claimer}}
    spec:
      # Never on the control plane: every claim must cross a node boundary.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      containers:
        - name: claimer
          image: percolationlabs/percolate-postgres:19
          imagePullPolicy: Never
          env: [{name: PGPASSWORD, value: workerpass}]
          command: ["/bin/bash", "-c"]
          args:
            - |
              cat > /tmp/claim.sql <<'SQL'
              select workflow.claim_task('scale', 'w' || :client_id);
              SQL
              echo "claimer $HOSTNAME starting"
              # -T 0 is not a thing; loop pgbench so the pod stays a load source.
              while true; do
                pgbench -h pg -U worker -d p8experiment -n \
                  -f /tmp/claim.sql -c 4 -j 2 -T 30 2>&1 | grep -E 'tps|latency'
              done
