# The stack this TREE builds. Two of them run from this one file -- `dev` and
# `test` -- and they differ only in the variables `dev/stacks.sh` exports:
# project name, container prefix, database name and a block of eight ports.
# Nothing here is shared between them, which is the whole point: a peer
# restarting dev must not be able to reach into test.
#
#     dev/stacks.sh up dev       # this file, as p8-dev,  on 5610-5617
#     dev/stacks.sh up test      # this file, as p8-test, on 5620-5627
#     docker compose up -d       # the same as `stacks.sh up dev`
#
# The last line is why every default below is the DEV instance's value: there
# is one way to describe this stack, not a file plus a wrapper that disagree
# with it.
#
# The OTHER two instances -- `release` and `dogfood` -- are deliberately NOT in
# this file and cannot be built from this tree. They run
# get-percolate/compose/docker-compose.yml, fetched from the URL the install
# guide tells a reader to curl, so that "what does a user actually get" has an
# answer that is not this repository grading its own homework.
name: p8-dev

# WHERE EACH CREDENTIAL MAY BE SENT, for every core service that sends one: the
# http_call steps of worker and ui-worker, and ui-ingest's embeddings and
# transcription.
# percolate-core resolves a credential only for an origin this map binds it to
# (core/credentials.py, deny by default), because the destination comes from a
# row or an upload that a signed-in user can write -- an upload's ingest policy
# could name its own host and have the ingest worker send P8_S3_SECRET there.
# With no entry, embedding and model calls are refused once the stack runs
# that core; the ui services mount the linked working copy, so they meet it
# first.
# Written once and referenced below, so the three services cannot disagree;
# the default is literal JSON inside ${...:-...}, which compose passes through
# intact (`docker compose config` shows it), and an environment value still
# replaces it.
x-credential-origins: &credential-origins '${P8_CREDENTIAL_ORIGINS:-{"LLM_API_KEY":["https://api.openai.com"]}}'

# THE CORE IMAGE, ONCE. Seven services ran this image and each named it in
# full, so following a percolate-core release meant seven identical edits in
# this file and about thirty across the tree -- and a missed one is invisible,
# because a compose file pinning the previous release is perfectly valid and
# starts perfectly well. `versions.toml` states the number the tree follows and
# `dev/references.sh` §3 now checks every literal against it; this anchor is
# the other half, so there is one line here to change rather than seven.
#
# `${P8_CORE_IMAGE:-...}` as well as the anchor, because the dev loop wants to
# run a locally built core against this stack without editing a tracked file --
# which was previously done by editing all seven and remembering to undo it.
x-core-image: &core-image '${P8_CORE_IMAGE:-percolationlabs/percolate-core:0.2.14}'

services:
  db:
    # Pulled, not built. The image carries PG19 + pgvector + both Percolate
    # extensions and installs them itself at first start, from the hook baked
    # into it -- so `docker compose up` is the whole install, and it is the
    # SAME install a user gets. There is no Dockerfile in your path and no
    # install script to run.
    #
    # `:19` is MUTABLE and that is the choice here, where `.github/workflows/
    # check.yml` pins to `:19-<published>` for the opposite reason. The
    # difference is what each is for: CI is a measurement and must not have the
    # thing under it move mid-run, while this stack is a workbench whose job is
    # to be current -- and `dev/stacks.sh reload` overwrites the extension SQL
    # from this tree the moment you are testing anything, so the image supplies
    # the parser and the roles rather than the schema. If you need a fixed one,
    # `image: percolationlabs/percolate-postgres:19-0.1.6` is the same image CI
    # would pin, and dev/currency.sh will tell you what you actually have.
    #
    # The `release` and `dogfood` instances pin, because a moving tag there
    # would make them another copy of dev wearing a different name.
    image: percolationlabs/percolate-postgres:19
    # NAMED, and parameterised, because every other script in this directory
    # addresses this container by name -- `docker exec <container> psql`, not a
    # DSN. Compose's generated name (p8-dev-db-1) would work too; a fixed one
    # means `dev/check.sh` and `dev/reload.sh` need no lookup step, and putting
    # the instance in the name means two instances cannot collide on it.
    container_name: ${P8_STACK:-p8-dev}-db
    # pg_cron runs as a background worker, so it must be preloaded at startup
    # -- there is no CREATE EXTENSION that can add it later. cron.database_name
    # is which database its worker connects to, and it can only be one; leaving
    # it at the default ('postgres') is the usual reason a correctly-created
    # job never runs. Passed as flags rather than baked into the image so the
    # image stays generic: the database name is this deployment's, not
    # Percolate's.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${P8_DB:-p8dev}
      # BOUNDS, EXPLICIT RATHER THAN PACKAGED (REM-113). None of these was set
      # anywhere in the estate. They are here as flags rather than in a conf so
      # the dev stack and the shipped compose say the same thing in the same
      # place.
      #
      # max_connections: the default 100 faces up to 72 backends from ONE
      # agent-runtime process (REM-110), before the worker, PostgREST's pool and
      # a person with psql. 200 is headroom, not a measurement.
      - -c
      - max_connections=200
      # work_mem is per sort/hash NODE, not per query, so a query with four
      # hash joins across eight parallel workers can take 32x this. 8MB against
      # 200 connections is a worst case nobody will reach and a default that
      # stops trivial sorts spilling to disk.
      - -c
      - work_mem=8MB
      - -c
      - shared_buffers=512MB
      # 256MB, and the /dev/shm note below is why this number is not larger:
      # pgvector sizes a parallel HNSW build's shared-memory segment from it.
      - -c
      - maintenance_work_mem=256MB
    # /dev/shm, because Docker's default for it is 64 MB and Postgres's
    # default `maintenance_work_mem` is ALSO 64 MB -- and pgvector sizes a
    # parallel HNSW build's shared-memory segment from the latter. The two
    # defaults collide exactly, so building or reindexing an HNSW index over a
    # corpus large enough to earn a parallel build fails with
    #
    #     could not resize shared memory segment ... to 63999392 bytes:
    #     No space left on device
    #
    # Measured: a REINDEX over a 200k-row, 64-dimension space fails on the
    # default and completes in 52 s with `max_parallel_maintenance_workers = 0`
    # -- which is what identifies the parallel segment as the thing that does
    # not fit, rather than the index itself. Nothing in dev/tests hits this,
    # because the committed corpus is six chunks and never builds in parallel.
    #
    # 1 GB rather than 128 MB so that raising maintenance_work_mem -- the first
    # thing anyone does to a slow index build -- does not walk back into it.
    shm_size: 1gb
    environment:
      POSTGRES_USER: p8
      POSTGRES_PASSWORD: p8
      POSTGRES_DB: ${P8_DB:-p8dev}
      # The two service roles the image's bootstrap creates. Passed explicitly,
      # with the same values the services below connect with, because the image
      # otherwise warns -- correctly -- that it is using the defaults printed in
      # its own source. Test-only; never reuse them anywhere reachable.
      P8_AUTHENTICATOR_PASSWORD: authpass
      P8_WORKER_PASSWORD: workerpass
      # The dev stack sets one, so app_provisioner exists here; a real install sets it only with an application.
      P8_APP_PROVISIONER_PASSWORD: provisionerpass
    ports:
      - "${P8_PG_PORT:-5610}:5432"
    volumes:
      # NOTHING IS MOUNTED AT /docker-entrypoint-initdb.d, and that is a
      # deletion rather than an omission. This file used to bind-mount ./init
      # over that directory, which REPLACES it -- so the image's own hook
      # (`image-init/`) never ran here, and init/ carried three files that
      # restated what it does. One bootstrap, two homes, and the dev stack was
      # the one place that did not exercise the shipped path. Those three files
      # are gone now; `image-init/00-superuser.sql` is the one copy, and every
      # script that stands up a database runs it.
      #
      # It also broke a from-zero start outright. initdb runs whatever is in
      # that directory against the extension the IMAGE ships, and `:19` is a
      # release or two behind this tree by design -- so `init/04-graph-sample.sql`,
      # a TREE fixture, died with
      #
      #     ERROR: function rbac.org_or_shared(uuid) does not exist
      #
      # the moment a branch added a function to it. The container exits 3 and
      # every service depending on it fails to start: a whole stack refusing to
      # boot over a sample row.
      #
      # So the image bootstraps itself exactly as it does for a user, and the
      # TREE's schema and samples arrive afterwards through `dev/reload.sh` --
      # install this tree's extension FIRST, then apply init/02..09 -- which is
      # what `dev/ci-database.sh` has always done and what `dev/stacks.sh up`
      # now does for any new database. The init/ samples are also mounted, one
      # file at a time beside the image's own hook, by
      # `dev/release-rehearsal.sh`, at a LOCALLY BUILT image where the versions
      # do match.
      #
      # MOUNTED AT /var/lib/postgresql, NOT .../data, and on 18+ that is the
      # difference between a stack that starts and one that restart-loops --
      # the postgres images moved PGDATA to a version-specific subdirectory and
      # refuse to start when they find anything at the old flat path. The
      # published compose file records the same finding at greater length.
      #
      # THE VOLUME IS NAMED, so it is namespaced by the compose project:
      # p8-dev_pgdata and p8-test_pgdata are different volumes and neither is
      # reachable from the other's stack. Before this the database lived in the
      # container's own filesystem, which is why `docker compose up --force-
      # recreate` in the wrong window has already cost this repository a day.
      - pgdata:/var/lib/postgresql
    # OVER TCP. On a first start the image's hook runs against a temporary
    # server that listens on the unix socket only, so a socket check can report
    # healthy mid-install and release every service below at a database with
    # no extension in it, moments before the entrypoint stops that server to
    # start the real one. TCP is not accepted until the install has finished.
    # The get-percolate chart's readiness probe (d6f79fc) and
    # dev/ci-database.sh already wait this way.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U p8 -d ${P8_DB:-p8dev}"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.8
    container_name: ${P8_STACK:-p8-dev}-postgrest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:authpass@db:5432/${P8_DB:-p8dev}
      # `agentic` is in this list because the agent runtime reads its own
      # agents and tool servers through these views like any other client
      # (brief.md §10.2) -- omitting it left the whole conversation plane
      # installed and unreachable. The FIRST schema is the default one;
      # every other is selected per request with Accept-Profile, which is
      # the fact `agentic.tool_servers.default_headers` exists for.
      PGRST_DB_SCHEMAS: content, aiq, rbac, workflow, agentic, public
      PGRST_DB_ANON_ROLE: web_anon
      # The REST half of the row cap (REM-113). aiq.sql_passthrough bounds what
      # a statement may aggregate; this bounds what any table or view read may
      # return, which is the larger surface -- PostgREST will happily stream a
      # whole table to anybody with select on it. Unset in all three
      # configurations before this.
      PGRST_DB_MAX_ROWS: 10000
      # Test-only secret -- never reuse in a real deployment.
      PGRST_JWT_SECRET: experiment-only-jwt-secret-not-for-real-use-0123456789
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:${P8_REST_PORT:-5611}
    # NOT 3000, and no longer 3099. Every published port in this file comes out
    # of ONE eight-port block per instance -- dev 5610-5617, test 5620-5627 --
    # because the alternative is what this machine actually had: nineteen
    # databases across ten containers on ports allocated one at a time, where
    # the only way to find out what a port served was to connect to it. The
    # canonical ports (5432, 3000, 8080, 8081, 9000/9001) stay free for the
    # published compose file, which is what every worked example in the docs
    # types. Container-internal URLs are unchanged: inside the compose network
    # postgrest is still :3000.
    ports:
      - "${P8_REST_PORT:-5611}:3000"

  # ---------------------------------------------------------------------
  # percolate-core, pulled from Docker Hub. One image, three entrypoints --
  # the services share percolate_core.core, so three images would be three
  # builds of the same base and three tags to keep in step.
  #
  # These `command:`s are ARGS to the image ENTRYPOINT (compose appends; only
  # Kubernetes replaces), and they are spelled for the pinned 0.1.6 image --
  # `content serve`, not the `p8 serve content` every spec now uses. They flip
  # with the image pin, together with the pool rows of the private kind stack. PACKAGING.md.
  #
  # None of them holds a table grant. Every database interaction is a
  # SECURITY DEFINER function call, and each sets the caller's claims per
  # transaction, so RLS sees the user rather than the service.
  # ---------------------------------------------------------------------
  worker:
    image: *core-image
    container_name: ${P8_STACK:-p8-dev}-worker
    depends_on:
      db:
        condition: service_healthy
    command: ["worker", "--queue", "http"]
    environment:
      P8_DSN: postgres://worker:workerpass@db:5432/${P8_DB:-p8dev}
      P8_WORKER_ID: worker-1
      # Credentials referenced by http_call tasks are resolved from HERE, by
      # name. The database stores only the reference, so a dump of
      # workflow.tasks never contains a secret.
      LLM_API_KEY: ${LLM_API_KEY:-}
      P8_CREDENTIAL_ORIGINS: *credential-origins

  # Opt-in workbench: `dev/stacks.sh ui`. Published dependencies, working-tree
  # Python code; the Docker network preserves the seeded tool-server URLs.
  # Neither process gets a privileged DB login, and the UI gets no provider key.
  #
  # THIS ONE STAYS BEHIND THE PROFILE, and the gate has its own. `agent` was
  # listed as the thing REM-10 should switch on -- "a service no gate starts is
  # a check that was correct and was never invoked" -- and taking the profile
  # off it would not have worked, for a reason that is visible two lines below:
  # it mounts `../percolate-core/percolate_core` over `/src`. That path is a
  # gitignored symlink into a sibling working tree. A CI checkout does not have
  # it, docker would create an empty directory there, and `import
  # percolate_core` would find the empty one first -- so the gate would start a
  # runtime with no code in it and report whatever that does.
  #
  # The mount is the POINT of this service: it is the workbench, and editing
  # `percolate_core/agentic/` and reloading the browser is what it is for. A
  # service that is both the working-tree workbench and the CI gate would have
  # to stop being one of them.
  #
  # So the gate starts its own, in `dev/tests/drive/agent-turn.sh`: the same
  # image, no mount, attached to the database container's own network namespace
  # -- which means it needs no compose stack, no published port and no sibling
  # checkout, and `dev/ci-database.sh` builds exactly the bare container it
  # wants. `dev/tests/agentic/06-a-turn.sql` is what asks for it.
  agent:
    profiles: [ui]
    image: *core-image
    container_name: ${P8_STACK:-p8-dev}-agent
    command: ["agent", "serve"]
    environment:
      PYTHONPATH: /src
      PYTHONDONTWRITEBYTECODE: "1"
      P8_DSN: postgres://authenticator:authpass@db:5432/${P8_DB:-p8dev}
      P8_JWT_SECRET: experiment-only-jwt-secret-not-for-real-use-0123456789
      P8_CORS_ORIGINS: http://localhost:${P8_UI_PORT:-8082},http://127.0.0.1:${P8_UI_PORT:-8082}
      # These first-party services verify the browser caller's JWT themselves.
      # Registered external tools never receive that caller credential.
      P8_TOOL_AUTH_ORIGINS: http://query-mcp:8090,http://postgrest:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # A `moonshotai:` agent model reads pydantic-ai's name for the Kimi key;
      # the root .env keeps it as KIMI_API_KEY.
      MOONSHOTAI_API_KEY: ${KIMI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - ../percolate-core/percolate_core:/src/percolate_core:ro
    ports:
      - "127.0.0.1:${P8_AGENT_PORT:-5612}:8080"

  ui:
    profiles: [ui]
    image: *core-image
    container_name: ${P8_STACK:-p8-dev}-ui
    command: ["ui", "serve", "--port", "8082"]
    environment:
      PYTHONPATH: /src
      PYTHONDONTWRITEBYTECODE: "1"
      P8_UI_REST_URL: http://localhost:${P8_REST_PORT:-5611}
      P8_UI_CORE_URL: http://localhost:${P8_AGENT_PORT:-5612}
      P8_UI_WORKFLOW_QUEUE: ui-workflows
      P8_UI_INGEST_QUEUE: ingest-ui
      P8_UI_CONTENT_URL: http://localhost:${P8_UI_CONTENT_PORT:-5618}
      P8_UI_DEV_TOKEN: "1"
      # The source is mounted, so adding a UI module must not need a manual
      # restart: without this the new file 404s and the page goes blank.
      P8_UI_RELOAD: "1"
      P8_UI_DEV_SECRET: experiment-only-jwt-secret-not-for-real-use-0123456789
    volumes:
      - ../percolate-core/percolate_core:/src/percolate_core:ro
    ports:
      - "127.0.0.1:${P8_UI_PORT:-8082}:8082"

  # Browser workbench content and a dedicated ingest queue. The normal content
  # service and any pending work on its ingest queue remain independently run.
  ui-content:
    profiles: [ui]
    image: *core-image
    container_name: ${P8_STACK:-p8-dev}-ui-content
    command: ["content", "serve"]
    environment:
      PYTHONPATH: /src
      PYTHONDONTWRITEBYTECODE: "1"
      P8_DSN: postgres://authenticator:authpass@db:5432/${P8_DB:-p8dev}
      P8_S3_ENDPOINT: http://minio:9000
      P8_S3_KEY: p8admin
      P8_S3_SECRET: p8password
      P8_BUCKET: p8-content
      P8_JWT_SECRET: experiment-only-jwt-secret-not-for-real-use-0123456789
      P8_CONTENT_CORS_ORIGINS: http://localhost:${P8_UI_PORT:-8082},http://127.0.0.1:${P8_UI_PORT:-8082}
    volumes:
      - ../percolate-core/percolate_core:/src/percolate_core:ro
    ports:
      - "127.0.0.1:${P8_UI_CONTENT_PORT:-5618}:8081"

  ui-ingest:
    profiles: [ui]
    image: *core-image
    container_name: ${P8_STACK:-p8-dev}-ui-ingest
    command: ["ingest", "serve", "--queue", "ingest-ui", "--id", "ui-ingest-1"]
    environment:
      PYTHONPATH: /src
      PYTHONDONTWRITEBYTECODE: "1"
      P8_DSN: postgres://worker:workerpass@db:5432/${P8_DB:-p8dev}
      P8_S3_ENDPOINT: http://minio:9000
      P8_S3_KEY: p8admin
      P8_S3_SECRET: p8password
      P8_BUCKET: p8-content
      LLM_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-}}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      P8_CREDENTIAL_ORIGINS: *credential-origins
      P8_INGEST_CREDENTIAL_ORIGINS: ${P8_INGEST_CREDENTIAL_ORIGINS:-}
    volumes:
      - ../percolate-core/percolate_core:/src/percolate_core:ro

  ui-worker:
    profiles: [ui]
    image: *core-image
    container_name: ${P8_STACK:-p8-dev}-ui-worker
    command: ["worker", "--queue", "ui-workflows", "--id", "ui-workflows-1"]
    environment:
      PYTHONPATH: /src
      PYTHONDONTWRITEBYTECODE: "1"
      P8_DSN: postgres://worker:workerpass@db:5432/${P8_DB:-p8dev}
      P8_AGENT_URL: http://agent:8080
      P8_AGENT_SIGNING_KEY_FILE: /run/secrets/agent-signing-key
      P8_CREDENTIAL_ORIGINS: *credential-origins
    volumes:
      - ../percolate-core/percolate_core:/src/percolate_core:ro
      - ./.stacks/ui-agent-signing-key:/run/secrets/agent-signing-key:ro

  content:
    image: *core-image
    container_name: ${P8_STACK:-p8-dev}-content
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    command: ["content", "serve"]
    environment:
      # authenticator, exactly as PostgREST uses it: it holds no privileges of
      # its own and can SET ROLE into web_anon or authenticated per request.
      # A service connecting as a role that CANNOT switch would run every query
      # as itself, ignoring the caller identity it just installed.
      P8_DSN: postgres://authenticator:authpass@db:5432/${P8_DB:-p8dev}
      P8_S3_ENDPOINT: http://minio:9000
      P8_S3_KEY: p8admin
      P8_S3_SECRET: p8password
      P8_BUCKET: p8-content
      P8_JWT_SECRET: experiment-only-jwt-secret-not-for-real-use-0123456789
    ports:
      - "${P8_CONTENT_PORT:-5613}:8081"

  # ---------------------------------------------------------------------
  # The one MCP tool this collection ships: `query`, over the p8ql dialect.
  #
  # Mounted from specs/ and run on a stock python image, exactly like faultsrv:
  # it is stdlib-only, so there is nothing to build and nothing to pull. It
  # holds NO credential -- it forwards the caller's Authorization header to
  # PostgREST, so RLS sees whoever is talking to the agent rather than seeing
  # this process (brief.md §11.1).
  # ---------------------------------------------------------------------
  query-mcp:
    image: python:3.12-alpine
    container_name: ${P8_STACK:-p8-dev}-query-mcp
    depends_on:
      db:
        condition: service_healthy
    command: python /query_mcp.py --port 8090 --postgrest http://postgrest:3000
    volumes:
      - ../specs/agentic/reference/query_mcp.py:/query_mcp.py:ro
    ports:
      - "${P8_MCP_PORT:-5616}:8090"
    restart: unless-stopped

  # Fault injection for workflow tests. Every failure this collection has hit
  # in real traffic, on demand, at a URL -- so a test of the retry branch does
  # not need SEC EDGAR to be having a bad day. See faultsrv/README.md.
  faultsrv:
    image: python:3.12-alpine
    container_name: ${P8_STACK:-p8-dev}-faultsrv
    command: python /app.py
    volumes:
      - ./faultsrv/app.py:/app.py:ro
    ports:
      - "${P8_FAULT_PORT:-5617}:8099"
    restart: unless-stopped
    # THE ALIAS IS LOAD-BEARING. Around forty committed fixtures --
    # tests/evals/scenarios.yaml, tests/evals/fixtures.sql, faultsrv/example.yaml
    # -- name `http://p8-faultsrv:8099/...` as the URL a workflow step calls,
    # and that name used to be this container's `container_name`. Instances
    # need distinct container names, so the name the fixtures use is pinned as
    # a network ALIAS instead: each instance has its own network, so p8-dev and
    # p8-test can both answer to `p8-faultsrv` inside their own and neither can
    # see the other's.
    networks:
      default:
        aliases: [p8-faultsrv]

  minio:
    # RUSTFS UNDER THE OLD NAME, as in get-percolate's compose file (REM-981).
    # MinIO's community images no longer pull: Docker Hub's minio/minio went on
    # 2026-09-11, and quay.io/minio/minio now refuses anonymous pulls, so a
    # fresh machine could not start this stack. RustFS passed the same checks
    # against percolate-core's storage and lake code
    # (an internal evaluation, 19 October). The fallback is
    # chrislusf/seaweedfs:4.48, which passed them too.
    #
    # PINNED BY DIGEST, the multi-arch index of rustfs/rustfs:1.0.3: a tag can
    # change the object store under a test run without a commit, and
    # dev/tests/content would notice only by failing.
    #
    # As its own uid 10001; `minio-perms` below is the only root.
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    container_name: ${P8_STACK:-p8-dev}-minio
    depends_on:
      minio-perms: {condition: service_completed_successfully}
    environment:
      RUSTFS_ACCESS_KEY: p8admin
      RUSTFS_SECRET_KEY: p8password
    ports:
      - "${P8_MINIO_PORT:-5614}:9000"
      - "${P8_MINIO_CONSOLE_PORT:-5615}:9001"
    volumes:
      # `miniodata`, the name the published compose file uses, rather than the
      # `p8-minio` this file used to say. Compose prefixes it with the project,
      # so the real names are p8-dev_miniodata and p8-test_miniodata.
      - miniodata:/data

  minio-perms:
    # ONE-SHOT. An existing `miniodata` holds MinIO's root-owned files; RustFS
    # reads MinIO's layout, but as uid 10001 it exits with "Permission denied".
    # This hands the volume to 10001 when anything in it belongs to someone
    # else, and exits; a fresh volume starts as 10001 and is left alone. The
    # same as get-percolate's compose file.
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    container_name: ${P8_STACK:-p8-dev}-minio-perms
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -n "$$(find /data ! -user 10001 -print -quit)" ]; then
          echo "miniodata: files not owned by uid 10001 (a MinIO volume?), handing it to 10001"
          chown -R 10001:10001 /data
        fi
    restart: "no"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
