services:
  db:
    # Pulled, not built. The image carries PG19 + pgvector + both Percolate
    # extensions, and init/ installs them at first start -- so `docker compose
    # up` is the whole install. There is no Dockerfile in your path and no
    # install script to run.
    image: percolationlabs/percolate-postgres:19
    container_name: p8-experiment-pg19
    # pg_cron runs as a background worker, so it must be preloaded at startup
    # -- there is no CREATE EXTENSION that can add it later. cron.database_name
    # is which database its worker connects to, and it can only be one; leaving
    # it at the default ('postgres') is the usual reason a correctly-created
    # job never runs. Passed as flags rather than baked into the image so the
    # image stays generic: the database name is this deployment's, not
    # Percolate's.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=p8experiment
    environment:
      POSTGRES_USER: p8
      POSTGRES_PASSWORD: p8
      POSTGRES_DB: p8experiment
    ports:
      - "5499:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p8 -d p8experiment"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v12.2.8
    container_name: p8-experiment-postgrest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:authpass@db:5432/p8experiment
      PGRST_DB_SCHEMAS: content, aiq, rbac, workflow, public
      PGRST_DB_ANON_ROLE: web_anon
      # Test-only secret -- never reuse in a real deployment.
      PGRST_JWT_SECRET: experiment-only-jwt-secret-not-for-real-use-0123456789
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
    ports:
      - "3000:3000"

  # ---------------------------------------------------------------------
  # percolate-core, pulled from Docker Hub. One image, three entrypoints --
  # the services share percolate_core.core, so three images would be three
  # builds of the same base and three tags to keep in step.
  #
  # None of them holds a table grant. Every database interaction is a
  # SECURITY DEFINER function call, and each sets the caller's claims per
  # transaction, so RLS sees the user rather than the service.
  # ---------------------------------------------------------------------
  worker:
    image: percolationlabs/percolate-core:0.1.2
    container_name: p8-worker
    depends_on:
      db:
        condition: service_healthy
    command: ["worker", "--queue", "http"]
    environment:
      P8_DSN: postgres://worker:workerpass@db:5432/p8experiment
      P8_WORKER_ID: worker-1
      # Credentials referenced by http_call tasks are resolved from HERE, by
      # name. The database stores only the reference, so a dump of
      # workflow.tasks never contains a secret.
      LLM_API_KEY: ${LLM_API_KEY:-}

  content:
    image: percolationlabs/percolate-core:0.1.2
    container_name: p8-content
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    command: ["content", "serve"]
    environment:
      # authenticator, exactly as PostgREST uses it: it holds no privileges of
      # its own and can SET ROLE into web_anon or authenticated per request.
      # A service connecting as a role that CANNOT switch would run every query
      # as itself, ignoring the caller identity it just installed.
      P8_DSN: postgres://authenticator:authpass@db:5432/p8experiment
      P8_S3_ENDPOINT: http://minio:9000
      P8_S3_KEY: p8admin
      P8_S3_SECRET: p8password
      P8_BUCKET: p8-content
      P8_JWT_SECRET: experiment-only-jwt-secret-not-for-real-use-0123456789
    ports:
      - "8081:8081"

  minio:
    image: minio/minio:latest
    container_name: p8-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: p8admin
      MINIO_ROOT_PASSWORD: p8password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - p8-minio:/data

volumes:
  p8-minio:
