# The model the stack's worker runs, and the one harness/beam_fetch.py embeds with.
embedding_models:
  - name: bge-small-en-v1.5
    dim: 384
    provider: fastembed
    endpoint: BAAI/bge-small-en-v1.5
    credential_ref: null
    is_default: true

# One channel per conversation: terms are fitted per channel, and a term two conversations share links nothing. The
# vectors arrive with the text, so the channels name no workflow.
channels:
  - name: beam-1m16
    kind: manual
    visibility: public
    config: {description: "BEAM 1M:16, one document per exchange"}
  - name: beam-1m26
    kind: manual
    visibility: public
    config: {description: "BEAM 1M:26, one document per exchange"}
  - name: walk-replays
    kind: manual
    visibility: public
    config: {description: "stand-in verdicts (NOT Jev), one document per question, read back by a run's {replay: document id}"}
  - name: walk-questions
    kind: manual
    visibility: public
    config: {description: "each question, by uri question:<qid>, without its answer key; never embedded"}
