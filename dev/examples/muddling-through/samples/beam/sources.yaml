# The model the walk study used, running in the worker. It is the image's default; registering it again is harmless.
embedding_models:
  - name: bge-small-en-v1.5
    dim: 384
    provider: fastembed
    endpoint: BAAI/bge-small-en-v1.5
    credential_ref: null
    is_default: true

# One channel per conversation, because each is one person's memory: terms are fitted per channel, and a term two
# conversations share links nothing. The workflow embeds and does not parse -- the text arrives in pieces already.
channels:
  - name: beam-1m22
    kind: manual
    visibility: public
    config: {ingest_workflow: embed_text, description: "BEAM 1M:22, one document per exchange"}
  - name: beam-1m35
    kind: manual
    visibility: public
    config: {ingest_workflow: embed_text, description: "BEAM 1M:35, one document per exchange"}

# Replay documents: each question's verdicts, which a run reads back by uri. Stored, never embedded, so the channel
# names no workflow.
  - name: walk-replays
    kind: manual
    visibility: public
    config: {description: "walk verdicts, one document per question, read back by a run's {replay: uri}"}
  - name: walk-questions
    kind: manual
    visibility: public
    config: {description: "each question and its answer key, by uri question:<qid>; never embedded"}
