# Replay documents: each step question's verdicts, which a run reads back by the document's id. Stored, never embedded.
channels:
  - name: walk-replays
    kind: manual
    visibility: public
    config: {description: "walk verdicts, one document per question, read back by a run's {replay: document id}"}
  - name: walk-questions
    kind: manual
    visibility: public
    config: {description: "each question, by uri question:<qid>, without its answer key; never embedded"}
